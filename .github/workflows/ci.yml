name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  statuses: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.19.0
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  EXPECTED_LOCAL_GATE_STATUS_ACTOR: ${{ vars.LOCAL_GATE_STATUS_ACTOR }}

jobs:
  github-policy:
    name: GitHub policy
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact change head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.HEAD_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify exact local-gate status
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/verify-pr-attestation.mjs

      - name: Enforce change budget
        env:
          CHANGE_BUDGET_EXCEPTION: ${{ contains(github.event.pull_request.labels.*.name, 'change-budget:exception') }}
          CHANGE_BUDGET_PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          args=(--base "$BASE_SHA" --head "$HEAD_SHA")
          if [[ "$CHANGE_BUDGET_EXCEPTION" == "true" ]]; then
            args+=(--exception)
          fi
          node scripts/ci/check-change-budget.mjs "${args[@]}"

      - name: Enforce commit identity allowlist
        env:
          DELIVERY_ALLOWED_COMMIT_EMAILS: ${{ vars.DELIVERY_ALLOWED_COMMIT_EMAILS }}
        run: node scripts/ci/commit-identity-check.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Verify public repository sanitation
        run: node scripts/public-sanitize-check.mjs

  ci-required:
    name: ci-required
    if: always() && github.event.pull_request.draft == false
    needs: [github-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require GitHub validation
        env:
          GITHUB_POLICY_RESULT: ${{ needs.github-policy.result }}
        run: |
          if [[ "$GITHUB_POLICY_RESULT" != "success" ]]; then
            echo "::error title=Required CI failed::GitHub policy validation ended with: $GITHUB_POLICY_RESULT"
            exit 1
          fi
