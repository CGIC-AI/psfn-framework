name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  statuses: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.19.0
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  EXPECTED_LOCAL_GATE_STATUS_ACTOR: ${{ vars.LOCAL_GATE_STATUS_ACTOR }}

jobs:
  github-delta:
    name: GitHub delta
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact change head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.HEAD_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin-ui/package-lock.json
            companion-ui/package-lock.json
            apps/satellite-hub/package-lock.json
            tools/evals/package-lock.json

      - name: Verify exact local-gate status
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/verify-pr-attestation.mjs

      - name: Test delivery rules
        run: npm run test:ci-rules

      - name: Enforce change budget
        env:
          CHANGE_BUDGET_EXCEPTION: ${{ contains(github.event.pull_request.labels.*.name, 'change-budget:exception') }}
          CHANGE_BUDGET_PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          args=(--base "$BASE_SHA" --head "$HEAD_SHA")
          if [[ "$CHANGE_BUDGET_EXCEPTION" == "true" ]]; then
            args+=(--exception)
          fi
          node scripts/ci/check-change-budget.mjs "${args[@]}"

      - name: Enforce commit identity allowlist
        run: npm run verify:commit-identities -- --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Detect clean-environment coverage
        id: scope
        run: node scripts/ci/detect-change-scope.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Scan changed workflow security surface
        run: node scripts/ci/run-zizmor-changed.mjs --format=github --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Install root dependencies in a clean environment
        if: steps.scope.outputs.root_runtime == 'true' || steps.scope.outputs.admin_ui == 'true' || steps.scope.outputs.deployment == 'true' || steps.scope.outputs.evals == 'true'
        run: npm ci --ignore-scripts

      - name: Set up pinned uv for Satellite Hub checks
        if: steps.scope.outputs.satellite_hub == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.6
          enable-cache: true
          cache-dependency-glob: apps/satellite-hub/uv.lock

      - name: Report import-graph impact for changed seam files
        if: steps.scope.outputs.root_runtime == 'true'
        run: |
          ./node_modules/.bin/tsx scripts/report-import-graph-impact.ts --base "$BASE_SHA" --head "$HEAD_SHA" \
            || echo "::warning title=Import-graph impact unavailable::Reporter process failed; informational check will not block CI."

      - name: Build root runtime in the clean environment
        if: steps.scope.outputs.root_runtime == 'true'
        env:
          # Keep in sync with ROOT_BUILD_NODE_HEAP_MB in scripts/ci/local-delivery-contract.mjs.
          # tsup's .d.ts rollup worker derives its old-gen cap from this value;
          # ~5.5 GB actual peak RSS, this buys DTS worker headroom, not real usage.
          NODE_OPTIONS: --max-old-space-size=12288
        run: npm run build

      - name: Build and test Garden in the clean environment
        if: steps.scope.outputs.admin_ui == 'true'
        run: npm ci --prefix admin-ui && npm --prefix admin-ui run build && npm --prefix admin-ui test

      - name: Lint, build, and test companion UI in the clean environment
        if: steps.scope.outputs.companion_ui == 'true'
        run: npm run verify:companion-ui

      - name: Check Satellite Hub in the clean environment
        if: steps.scope.outputs.satellite_hub == 'true'
        run: npm run verify:satellite-hub

      - name: Check eval toolkit in the clean environment
        if: steps.scope.outputs.evals == 'true'
        run: npm run verify:evals

      - name: Verify deployment contracts in the clean environment
        if: steps.scope.outputs.deployment == 'true'
        run: npm run verify:deployment-contracts

  ci-required:
    name: ci-required
    if: always() && github.event.pull_request.draft == false
    needs: [github-delta]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the complementary GitHub lane
        env:
          GITHUB_DELTA_RESULT: ${{ needs.github-delta.result }}
        run: |
          if [[ "$GITHUB_DELTA_RESULT" != "success" ]]; then
            echo "::error title=Required CI failed::GitHub delta ended with: $GITHUB_DELTA_RESULT"
            exit 1
          fi
