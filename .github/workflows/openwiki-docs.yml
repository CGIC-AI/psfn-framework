name: OpenWiki docs

# Manual only: run at end-of-sprint once new work has landed. No schedule —
# an unattended full-tree regeneration wastes spend and creates review churn.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openwiki-docs
  cancel-in-progress: false

env:
  NODE_VERSION: 24.19.0
  OPENWIKI_VERSION: 0.4.3

jobs:
  update:
    name: Update docs from OpenWiki
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate wiki
        env:
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_BASE_URL: https://api.deepseek.com
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENWIKI_MODEL_ID: deepseek-v4-flash
          OPENWIKI_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
          OPENWIKI_MAX_OUTPUT_TOKENS: "384000"
        run: |
          if [[ -z "${OPENAI_COMPATIBLE_API_KEY}" ]]; then
            echo "::error::DEEPSEEK_API_KEY secret is required"
            exit 1
          fi
          npx --package "openwiki@${OPENWIKI_VERSION}" openwiki code --update --print
          git checkout -- AGENTS.md || true

      - name: Copy generated pages into docs
        run: node scripts/sync-openwiki-to-docs.mjs

      - name: Create documentation pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |
            docs
            openwiki/INSTRUCTIONS.md
          branch: openwiki/docs-update
          commit-message: "docs: refresh generated documentation"
          title: "docs: refresh generated documentation"
          body: |
            Manual end-of-sprint OpenWiki update copied into `docs/`.

            `docs/PSFN_PROJECT_CHARTER.md` is operator-owned and is never overwritten.
