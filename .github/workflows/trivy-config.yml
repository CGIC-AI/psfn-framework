name: Trivy IaC Config Scan

# Renders the repo-authoritative Helm chart and scans the rendered
# Kubernetes/Helm manifests for HIGH/CRITICAL misconfigurations. Trivy owns the
# IaC/config and container-image surfaces only (OSV owns npm dependencies,
# Semgrep owns code). Runs on IaC-touching pull requests (a standalone gate,
# never wired into the ci-required contract) and on a weekly schedule so the
# bundled misconfiguration checks are refreshed even without a code change.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "deploy/helm/**"
      - "docker/**"
      - ".trivyignore.yaml"
      - "scripts/ci/run-trivy-scan.mjs"
      - ".github/workflows/trivy-config.yml"
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivy-config-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trivy-config:
    name: Trivy rendered-chart misconfiguration scan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.13.1

      # helm and docker are preinstalled on ubuntu-24.04 runners (the CI
      # deployment lane already renders with helm). The wrapper renders the
      # authoritative chart into a per-template directory and scans it with the
      # digest-pinned Trivy image; render failure, empty output, an expired
      # ignore entry, or a scanner error fails closed.
      - name: Render the authoritative chart and scan for HIGH/CRITICAL misconfigurations
        run: node scripts/ci/run-trivy-scan.mjs config
