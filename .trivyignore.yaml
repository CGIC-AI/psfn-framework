# Trivy misconfiguration exceptions for the PSFN Helm chart config scan.
#
# Every entry is EXACT (one rule, one rendered template path), JUSTIFIED, OWNED,
# and EXPIRING. Broad rule- or path-wide suppression is forbidden. Trivy 0.72.0
# does not enforce `expiry` for misconfiguration ignores, so scripts/ci/run-trivy-scan.mjs
# enforces it: an entry that is missing/malformed/past its expiry fails the gate
# closed and forces a fresh review. Paths are the Helm `--output-dir` render
# targets produced by the config scan (psfn/templates/<file>.yaml).
#
# Only the postgres and redis StatefulSets are risk-accepted here. The first-party
# app containers (agent, gateway, Garden, LiteLLM, and their init containers) were
# remediated to readOnlyRootFilesystem: true; if any of them regresses to a
# writable root the finding surfaces under psfn/templates/workloads.yaml (or
# litellm.yaml) and is NOT covered by these entries, so the gate fails.

misconfigurations:
  - id: AVD-KSV-0014
    paths:
      - "psfn/templates/postgres.yaml"
    statement: >-
      Postgres StatefulSet root filesystem is left writable. The upstream
      Postgres image entrypoint switches user and writes its unix socket, lock
      and PGDATA scaffolding across the root filesystem at startup, so a
      read-only root or an emptyDir-per-writable-path mapping cannot be shipped
      without live k3s validation of every runtime write path. The container is
      otherwise hardened (allowPrivilegeEscalation: false, seccompProfile:
      RuntimeDefault). Read-only-root hardening is a live-validated follow-up.
    expiry: 2026-10-20T00:00:00Z
  - id: AVD-KSV-0014
    paths:
      - "psfn/templates/redis.yaml"
    statement: >-
      Redis StatefulSet root filesystem is left writable. The upstream Redis
      image writes runtime state under its data dir and may touch other root
      paths during save/startup; a read-only root cannot be shipped without live
      k3s validation. The container is otherwise hardened
      (allowPrivilegeEscalation: false, seccompProfile: RuntimeDefault).
      Read-only-root hardening is a live-validated follow-up.
    expiry: 2026-10-20T00:00:00Z
