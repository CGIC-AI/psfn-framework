# Copy to secrets.yaml. Never commit the populated file.
wifi_ssid: "replace-with-bedroom-wifi-ssid"
wifi_password: "replace-with-bedroom-wifi-password"

# Generate endpoint-specific ESPHome credentials rather than reusing another
# device's keys.
api_encryption_key: "replace-with-32-byte-base64-key"
ota_password: "replace-with-unique-ota-password"

# Realtime/control credential. The hub registry stores only its SHA-256 digest.
hub_device_token: "replace-with-a-unique-random-device-token"
