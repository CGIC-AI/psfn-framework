# Example values for the k3d fleet shakedown shape: one shared gateway and
# fleet Garden plus two registered companions (the first entry is the
# primary/canonical companion, the second is a follower). Rendering this file
# is the chart-owned equivalent of the previously hand-drifted multi-companion
# topology: follower agent Deployment + NetworkPolicy admits, per-companion
# admin Services and certificates, gateway per-companion companion-data and
# workspace mounts, and the FLEET_AUTH_* gateway credential env.
#
# Prerequisites this file cannot create (fail-closed by design):
#   - the system-data PVC already contains the canonical companions.json and
#     fleet-auth.json owner files matching the entries below
#   - the per-companion PVCs (companion data + Personal Workspace) exist
#   - the non-restored psfn-fleet-auth-floor authority-floor PVC exists
#   - the per-companion auth Secrets and the psfn-fleet-auth credential
#     Secret exist (see fleetAuth.credentialEnv below)
#   - the browser-trusted gateway edge TLS Secret exists
#
# Render check:
#   helm template psfn deploy/helm/psfn \
#     -f deploy/helm/psfn/overlays/fleet-k3d-shakedown.values.yaml

runtime:
  # Must equal the FIRST fleet companion and its canonical derived paths;
  # validations fail the render otherwise. The gateway crashloops via the
  # fail-closed legacy-workspace migration when workspacePath is not the
  # first companion's canonical Personal Workspace.
  companionId: 11111111-1111-4111-8111-111111111111
  systemDataDir: /runtime/system-data
  companionDataDir: /runtime/companions/11111111-1111-4111-8111-111111111111
  characterCardPath: /runtime/companions/11111111-1111-4111-8111-111111111111/companion.json
  workspacePath: /runtime/workspaces/personal/11111111-1111-4111-8111-111111111111
  logsDir: /runtime/logs
  tempDir: /runtime/tmp
  backupsDir: /runtime/backups

fleet:
  runtimeRoot: /runtime
  companions:
    # Primary/canonical companion (first entry; backup leader).
    - companionId: 11111111-1111-4111-8111-111111111111
      postgresSchema: companion_a
      companionDataClaim: companion-a-data
      workspaceClaim: companion-a-workspace
      authSecret:
        name: companion-a-auth
        sessionIntegrityKey: session-integrity-token
        companionAuthKey: companion-auth-token
    # Follower companion: dedicated agent Deployment, admin Service
    # (<release>-agent-admin-<companionId>), per-companion certificates, and
    # gateway RPC/NetworkPolicy admits are all rendered from this entry.
    - companionId: 22222222-2222-4222-8222-222222222222
      postgresSchema: companion_b
      companionDataClaim: companion-b-data
      workspaceClaim: companion-b-workspace
      authSecret:
        name: companion-b-auth
        sessionIntegrityKey: session-integrity-token
        companionAuthKey: companion-auth-token

persistence:
  # Both must name the FIRST companion's claims (validated).
  companionData:
    existingClaim: companion-a-data
  workspace:
    existingClaim: companion-a-workspace

bootstrap:
  # Fleet installs never self-seed; companions.json and the owner roots are
  # operator-provisioned.
  seedOwnerFiles: false

fleetAuth:
  # Adopt the live anti-rollback floor PVC. It is mounted only by the gateway,
  # initialized as uid/gid 999 with mode 0700, and deliberately never included
  # in the chart's normal backup/restore claims.
  authorityFloor:
    existingClaim: psfn-fleet-auth-floor
    size: 64Mi
    storageClassName: ""
    mountPath: /var/lib/psfn/fleet-auth-floor
  # Every env-kind credential reference in fleet-auth.json must be supplied
  # here (the gateway fails closed on any unset referenced env var). The
  # names below match config/fleet-auth.seed.json; keep them aligned with the
  # deployed owner file. Create the Secret out of band, e.g.:
  #   kubectl create secret generic psfn-fleet-auth \
  #     --from-literal=discord-client-secret=... \
  #     --from-literal=token-encryption-key=... \
  #     --from-literal=session-pepper=... \
  #     --from-literal=assertion-private-key=... \
  #     --from-literal=recovery-credential=... \
  #     --from-literal=runtime-database-url=... \
  #     --from-literal=migration-database-url=... \
  #     --from-literal=backup-database-url=...
  credentialEnv:
    - name: FLEET_AUTH_DISCORD_CLIENT_SECRET
      secretRef:
        name: psfn-fleet-auth
        key: discord-client-secret
    - name: FLEET_AUTH_TOKEN_ENCRYPTION_KEY
      secretRef:
        name: psfn-fleet-auth
        key: token-encryption-key
    - name: FLEET_AUTH_SESSION_PEPPER
      secretRef:
        name: psfn-fleet-auth
        key: session-pepper
    - name: FLEET_AUTH_ASSERTION_PRIVATE_KEY
      secretRef:
        name: psfn-fleet-auth
        key: assertion-private-key
    - name: FLEET_AUTH_RECOVERY_CREDENTIAL
      secretRef:
        name: psfn-fleet-auth
        key: recovery-credential
    - name: FLEET_AUTH_RUNTIME_DATABASE_URL
      secretRef:
        name: psfn-fleet-auth
        key: runtime-database-url
    - name: FLEET_AUTH_MIGRATION_DATABASE_URL
      secretRef:
        name: psfn-fleet-auth
        key: migration-database-url
    - name: FLEET_AUTH_BACKUP_DATABASE_URL
      secretRef:
        name: psfn-fleet-auth
        key: backup-database-url

ingress:
  enabled: true
  gateway:
    enabled: true
    host: psfn-gateway.local
    path: /
    pathType: Prefix
    tls:
      enabled: true
      # Browser-trusted certificate for the exact canonicalOrigin host above.
      secretName: psfn-gateway-edge-tls
