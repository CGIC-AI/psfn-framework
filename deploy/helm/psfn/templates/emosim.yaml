{{- if .Values.emosim.enabled }}
# emo_sim observer-eval engine: one long-lived session host so the observer
# sidecar accumulates temporal emotion state across turns. The API is
# unauthenticated by upstream design — ClusterIP only, never expose externally
# (see networkpolicy.yaml for the agent-only ingress rule).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "psfn.emosimServiceName" . }}
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.ports.emosimHttp }}
      targetPort: http
    - name: tcp-push
      port: {{ .Values.ports.emosimTcp }}
      targetPort: tcp-push
  selector:
    {{- include "psfn.componentLabels" (dict "root" . "component" "emosim") | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "psfn.fullname" . }}-emosim-state
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.emosim.persistence.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "psfn.fullname" . }}-emosim
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
spec:
  # Single replica with Recreate: the engine owns its state directory and the
  # experiment requires exactly one continuously-ticking session world.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "psfn.componentLabels" (dict "root" . "component" "emosim") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "psfn.componentLabels" (dict "root" . "component" "emosim") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: emosim
          image: {{ include "psfn.emosimImage" . | quote }}
          imagePullPolicy: {{ .Values.emosim.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.emosim.extraArgs }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 17342
            - name: tcp-push
              containerPort: 17341
          readinessProbe:
            httpGet:
              path: /api/model
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/model
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.emosim.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /state
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "psfn.fullname" . }}-emosim-state
{{- end }}
