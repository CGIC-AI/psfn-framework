{{- if .Values.ingress.enabled }}
{{- if .Values.ingress.gateway.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "psfn.fullname" . }}-gateway
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.gateway.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.gateway.host | quote }}
      secretName: {{ .Values.ingress.gateway.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.gateway.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.gateway.path | quote }}
            pathType: {{ .Values.ingress.gateway.pathType }}
            backend:
              service:
                name: {{ include "psfn.gatewayApiServiceName" . }}
                port:
                  name: http-api
---
{{- end }}
{{- if and .Values.satelliteHub.enabled .Values.ingress.satelliteHub.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "psfn.fullname" . }}-satellite-hub
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.satelliteHub.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.satelliteHub.path | quote }}
            pathType: {{ .Values.ingress.satelliteHub.pathType }}
            backend:
              service:
                name: {{ include "psfn.satelliteHubServiceName" . }}
                port:
                  name: hub-ws
{{- end }}
{{- end }}
