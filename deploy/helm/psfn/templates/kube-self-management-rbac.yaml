{{- if .Values.kubeSelfManagement.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "psfn.kubeSelfManagementServiceAccountName" . }}
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "psfn.fullname" . }}-kube-self-management
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - {{ include "psfn.fullname" . }}-agent
      - {{ include "psfn.fullname" . }}-gateway
      - {{ include "psfn.fullname" . }}-garden
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "psfn.fullname" . }}-kube-self-management
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "psfn.kubeSelfManagementServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "psfn.fullname" . }}-kube-self-management
{{- end }}
