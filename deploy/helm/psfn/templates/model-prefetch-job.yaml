{{- define "psfn.modelPrefetchJobSpec" -}}
{{- $injectionEnabled := and .Values.modelPrefetch.injectionClassifier.enabled .Values.persistence.modelCache.enabled }}
backoffLimit: {{ .Values.modelPrefetch.backoffLimit }}
activeDeadlineSeconds: {{ .Values.modelPrefetch.activeDeadlineSeconds }}
ttlSecondsAfterFinished: {{ .Values.modelPrefetch.ttlSecondsAfterFinished }}
template:
  metadata:
    labels:
      {{- include "psfn.componentLabels" (dict "root" . "component" "model-prefetch") | nindent 6 }}
  spec:
    serviceAccountName: {{ include "psfn.serviceAccountName" . }}
    automountServiceAccountToken: false
    restartPolicy: Never
    securityContext:
      {{- toYaml .Values.podSecurityContext | nindent 6 }}
    {{- with .Values.imagePullSecrets }}
    imagePullSecrets:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    containers:
      {{- if .Values.modelPrefetch.textEmotion.enabled }}
      - name: text-emotion
        image: {{ include "psfn.image" (dict "root" . "image" .Values.modelPrefetch.image) | quote }}
        imagePullPolicy: {{ default .Values.psfnAppImage.pullPolicy .Values.modelPrefetch.image.pullPolicy }}
        command:
          - node
          - --input-type=module
          - -e
          - |
            import { mkdirSync } from 'node:fs';

            const model = process.env.PSFN_PREFETCH_TEXT_EMOTION_MODEL?.trim();
            if (!model) {
              throw new Error('PSFN_PREFETCH_TEXT_EMOTION_MODEL is required');
            }

            const cacheDir = process.env.TRANSFORMERS_CACHE_DIR?.trim() || {{ .Values.runtime.modelCacheDir | quote }};
            const dtype = process.env.PSFN_PREFETCH_TEXT_EMOTION_DTYPE?.trim() || {{ .Values.modelPrefetch.textEmotion.dtype | quote }};
            mkdirSync(cacheDir, { recursive: true });

            const { pipeline, env } = await import('@huggingface/transformers');
            env.cacheDir = cacheDir;

            const classifier = await pipeline('text-classification', model, { dtype });
            await classifier('prefetch emotion model', { top_k: 28 });
            console.log(`[model-prefetch] text emotion model prefetched: ${model}`);
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        env:
          - name: NODE_ENV
            value: {{ .Values.runtime.nodeEnv | quote }}
          - name: HOME
            value: /app
          - name: TRANSFORMERS_CACHE_DIR
            value: {{ .Values.runtime.modelCacheDir | quote }}
          - name: TRANSFORMERS_CACHE
            value: {{ .Values.runtime.modelCacheDir | quote }}
          - name: PSFN_PREFETCH_TEXT_EMOTION_MODEL
            value: {{ .Values.modelPrefetch.textEmotion.model | quote }}
          - name: PSFN_PREFETCH_TEXT_EMOTION_DTYPE
            value: {{ .Values.modelPrefetch.textEmotion.dtype | quote }}
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ include "psfn.appSecretName" . }}
                key: {{ .Values.secrets.keys.hfToken }}
                optional: true
        resources:
          {{- toYaml .Values.modelPrefetch.resources | nindent 10 }}
        volumeMounts:
          - name: model-cache
            mountPath: {{ .Values.runtime.modelCacheDir }}
      {{- end }}
      {{- if $injectionEnabled }}
      # L1.5 intake injection-classifier weights (cyy7l). The gateway reads
      # them from {{ .Values.runtime.modelCacheDir }}/prompt-injection-v2 (its
      # PSFN_INJECTION_MODEL_DIR); in enforce mode a missing directory FAILS
      # the gateway closed at startup. This container provisions the pinned,
      # sha256-verified weights onto the shared model-cache PVC before the
      # restricted-egress gateway relies on them.
      - name: injection-classifier
        image: {{ include "psfn.image" (dict "root" . "image" .Values.modelPrefetch.image) | quote }}
        imagePullPolicy: {{ default .Values.psfnAppImage.pullPolicy .Values.modelPrefetch.image.pullPolicy }}
        command:
          - node
          - /app/dist/provision-injection-model.js
          - --dest
          - {{ printf "%s/prompt-injection-v2" .Values.runtime.modelCacheDir | quote }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        env:
          - name: NODE_ENV
            value: {{ .Values.runtime.nodeEnv | quote }}
          - name: HOME
            value: /app
          - name: PSFN_INJECTION_MODEL_DIR
            value: {{ printf "%s/prompt-injection-v2" .Values.runtime.modelCacheDir | quote }}
        resources:
          {{- toYaml .Values.modelPrefetch.resources | nindent 10 }}
        volumeMounts:
          - name: model-cache
            mountPath: {{ .Values.runtime.modelCacheDir }}
      {{- end }}
    volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: {{ include "psfn.fullname" . }}-model-cache
{{- end }}

{{- $injectionEnabled := and .Values.modelPrefetch.injectionClassifier.enabled .Values.persistence.modelCache.enabled }}
{{- if and .Values.modelPrefetch.enabled (or .Values.modelPrefetch.textEmotion.enabled $injectionEnabled) }}
{{- $jobSpec := include "psfn.modelPrefetchJobSpec" . }}
{{- $specHash := sha256sum $jobSpec | trunc 16 }}
{{- $nameBase := include "psfn.fullname" . | trunc 31 | trimSuffix "-" }}
apiVersion: batch/v1
kind: Job
metadata:
  # Jobs have immutable pod templates. Keying the object identity to the
  # complete rendered spec makes an app-image or prefetch-config change create
  # a replacement Job instead of attempting an invalid in-place mutation.
  name: {{ printf "%s-model-prefetch-%s" $nameBase $specHash }}
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-prefetch
    psfn.io/model-prefetch-spec-hash: {{ $specHash | quote }}
spec:
  {{- $jobSpec | nindent 2 }}
{{- end }}
