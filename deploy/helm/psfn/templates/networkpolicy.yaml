{{- if .Values.companionUiTest.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "psfn.fullname" . }}-companion-ui-test
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "psfn.componentLabels" (dict "root" . "component" "companion-ui-test") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.podSelector | nindent 14 }}
      ports:
        - port: {{ .Values.ports.companionUiTest }}
          protocol: TCP
  # The static web surface serves files only and makes no outbound calls; the
  # browser talks to the hub directly. The empty list denies all egress.
  egress: []
{{- end }}
{{- end }}
