metadata:
  name: {{ include "psfn.fullname" . }}-redis
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "psfn.componentLabels" (dict "root" . "component" "redis") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "psfn.componentLabels" (dict "root" . "component" "agent") | nindent 14 }}
      ports:
        - port: {{ .Values.ports.redis }}
          protocol: TCP
{{- end }}
{{- if .Values.emosim.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "psfn.fullname" . }}-emosim
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "psfn.componentLabels" (dict "root" . "component" "emosim") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "psfn.componentLabels" (dict "root" . "component" "agent") | nindent 14 }}
      ports:
        - port: {{ .Values.ports.emosimHttp }}
          protocol: TCP
  # The emo_sim engine needs no egress at all; the empty list denies it.
  egress: []
{{- end }}
{{- if and .Values.liteLlm.enabled (eq .Values.liteLlm.mode "internal") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "psfn.fullname" . }}-litellm
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "psfn.componentLabels" (dict "root" . "component" "litellm") | nindent 6 }}
