{{- if .Values.ownerMigration.enabled }}
{{- $root := . -}}
{{- $participants := list -}}
{{- range .Values.ownerMigration.companions -}}
{{- $participants = append $participants .companionId -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "psfn.fullname" . }}-owner-migration-{{ .Release.Revision }}
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
    app.kubernetes.io/component: owner-migration
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.ownerMigration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "psfn.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: owner-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: snapshot-whole-fleet
          image: {{ include "psfn.ownerMigrationImage" (dict "root" . "image" .Values.workloads.agent.image) | quote }}
          imagePullPolicy: {{ default .Values.psfnAppImage.pullPolicy .Values.workloads.agent.image.pullPolicy }}
          command:
            - node
            - /app/dist/system-owner-fleet-snapshot.js
            - capture
            - --output
            - {{ .Values.ownerMigration.snapshotOutputDir | quote }}
          env: &ownerMigrationEnv
            - name: NODE_ENV
              value: production
            - name: PSFN_RUNTIME_LAYOUT_MODE
              value: production
            - name: PSFN_RUNTIME_ROOT
              value: {{ .Values.ownerMigration.runtimeRoot | quote }}
            - name: SYSTEM_DATA_DIR
              value: {{ .Values.ownerMigration.systemDataDir | quote }}
            - name: COMPANION_DATA_DIR
              value: {{ (index .Values.ownerMigration.companions 0).mountPath | quote }}
            - name: WORKSPACE_PATH
              value: /scratch/workspace
            - name: PSFN_LOGS_DIR
              value: /scratch/logs
            - name: PSFN_TEMP_DIR
              value: /scratch/tmp
            - name: BACKUP_ROOT_DIR
              value: {{ .Values.ownerMigration.backupsDir | quote }}
            - name: CONFIG_DIR
              value: /app/config
            - name: COMPANION_ID
              value: {{ (index .Values.ownerMigration.companions 0).companionId | quote }}
            {{- /* Topology is derived from companions.json presence by the
                   migrator (system-owner-fleet-context.ts), not the retired
                   PSFN_MULTI_COMPANION flag, so it is intentionally not set. */}}
            - name: PSFN_FLEET_AUTH
              value: "false"
            - name: DATA_DIR
              value: ""
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts: &ownerMigrationMounts
            - name: system-data
              mountPath: {{ .Values.ownerMigration.systemDataDir | quote }}
            - name: backups
              mountPath: {{ .Values.ownerMigration.backupsDir | quote }}
              {{- with .Values.ownerMigration.backupsSubPath }}
              subPath: {{ . | quote }}
              {{- end }}
            - name: scratch
              mountPath: /scratch
            {{- range $index, $companion := .Values.ownerMigration.companions }}
            - name: companion-{{ $index }}
              mountPath: {{ $companion.mountPath | quote }}
            {{- end }}
        - name: migrate-system-owner-fleet
          image: {{ include "psfn.ownerMigrationImage" (dict "root" . "image" .Values.workloads.agent.image) | quote }}
          imagePullPolicy: {{ default .Values.psfnAppImage.pullPolicy .Values.workloads.agent.image.pullPolicy }}
          command:
            - node
            - /app/dist/migrate-system-owner-fleet.js
            - --apply
            {{- range $ownerFile, $digest := .Values.ownerMigration.approvals }}
            - --approve
            - {{ printf "%s=%s" $ownerFile $digest | quote }}
            {{- end }}
          env: *ownerMigrationEnv
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts: *ownerMigrationMounts
      containers:
        {{- if .Values.ownerMigration.verification.enabled }}
        {{- range $index, $companion := .Values.ownerMigration.companions }}
        - name: probe-{{ $index }}
          image: {{ include "psfn.ownerMigrationImage" (dict "root" $root "image" $root.Values.workloads.agent.image) | quote }}
          imagePullPolicy: {{ default $root.Values.psfnAppImage.pullPolicy $root.Values.workloads.agent.image.pullPolicy }}
          command:
            - node
            - /app/dist/owner-upgrade-readiness-probe.js
            - --mode
            - companion
            - --companion-id
            - {{ $companion.companionId | quote }}
            - --companion-data-dir
            - {{ $companion.mountPath | quote }}
            - --participants
            - {{ join "," $participants | quote }}
            - --expected-initial-charge
            - {{ $root.Values.ownerMigration.verification.initialChargeQuota | quote }}
            - --expected-initial-skills
            - {{ $root.Values.ownerMigration.verification.initialMaxLoadedSkills | quote }}
            - --expected-identity-sha256
            - {{ $companion.expectedIdentitySha256 | quote }}
            - --barrier-dir
            - /barrier
            - --timeout-seconds
            - {{ $root.Values.ownerMigration.verification.timeoutSeconds | quote }}
          securityContext:
            {{- toYaml $root.Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: companion-{{ $index }}
              mountPath: {{ $companion.mountPath | quote }}
              readOnly: true
            - name: barrier
              mountPath: /barrier
        {{- end }}
        {{- else }}
        - name: migration-complete
          image: {{ include "psfn.ownerMigrationImage" (dict "root" . "image" .Values.workloads.agent.image) | quote }}
          imagePullPolicy: {{ default .Values.psfnAppImage.pullPolicy .Values.workloads.agent.image.pullPolicy }}
          command: ["node", "-e", "process.exit(0)"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
        {{- end }}
      volumes:
        - name: system-data
          persistentVolumeClaim:
            claimName: {{ .Values.ownerMigration.systemDataClaim | quote }}
        - name: backups
          persistentVolumeClaim:
            claimName: {{ .Values.ownerMigration.backupsClaim | quote }}
        - name: scratch
          emptyDir: {}
        - name: barrier
          emptyDir: {}
        {{- range $index, $companion := .Values.ownerMigration.companions }}
        - name: companion-{{ $index }}
          persistentVolumeClaim:
            claimName: {{ $companion.claimName | quote }}
        {{- end }}
{{- end }}
