{{- if and .Values.satelliteHub.enabled (include "psfn.satelliteHubDeviceRegistryEnabled" .) }}
{{- /* Server-owned Hub device registry (HUB_DEVICE_REGISTRY_PATH). Reachable
     through satelliteHub.deviceRegistry on its own; satelliteHub.homeAssistant
     keeps implying it for compatibility, with homeAssistant.devices honoured
     when deviceRegistry.devices is empty. Enrolled devices need the signing
     authority in satelliteHub.deviceAssertion, which workloads.yaml enforces
     at render time instead of letting the pod crash (psfn-framework-x4499). */}}
{{- $devices := include "psfn.satelliteHubDeviceRegistryDevices" . | fromJsonArray }}
{{- if not $devices }}
{{- fail "satelliteHub.deviceRegistry.devices (or homeAssistant.devices) must list at least one device when the registry is enabled" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "psfn.fullname" . }}-hub-devices
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
data:
  hub-devices.json: |
    {{ dict "schemaVersion" 1 "devices" $devices | toJson | nindent 4 }}
{{- end }}
