{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- if not .Values.secrets.allowMissingRequired }}
{{- $_ := required "secrets.values.apiKey is required when secrets.allowMissingRequired=false" .Values.secrets.values.apiKey }}
{{- $_ := required "secrets.values.adminToken is required when secrets.allowMissingRequired=false" .Values.secrets.values.adminToken }}
{{- $_ := required "secrets.values.gatewaySessionHmacKey is required when secrets.allowMissingRequired=false" .Values.secrets.values.gatewaySessionHmacKey }}
{{- $_ := required "secrets.values.gatewaySessionIntegrityAuthToken is required when secrets.allowMissingRequired=false" .Values.secrets.values.gatewaySessionIntegrityAuthToken }}
{{- $_ := required "secrets.values.gatewayCompanionAuthToken is required when secrets.allowMissingRequired=false" .Values.secrets.values.gatewayCompanionAuthToken }}
{{- $_ := required "secrets.values.backupEncryptionKey is required when secrets.allowMissingRequired=false" .Values.secrets.values.backupEncryptionKey }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "psfn.appSecretName" . }}
  annotations:
    # A later switch to secrets.existingSecret removes this object from the
    # manifest. Keep it orphaned so Helm pruning cannot delete live credentials.
    helm.sh/resource-policy: keep
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.values.apiKey }}
  {{ $.Values.secrets.keys.apiKey }}: {{ $.Values.secrets.values.apiKey | quote }}
  {{- end }}
  {{- with .Values.secrets.values.adminToken }}
  {{ $.Values.secrets.keys.adminToken }}: {{ $.Values.secrets.values.adminToken | quote }}
  {{- end }}
  {{- with .Values.secrets.values.gatewaySessionHmacKey }}
  {{ $.Values.secrets.keys.gatewaySessionHmacKey }}: {{ $.Values.secrets.values.gatewaySessionHmacKey | quote }}
  {{- end }}
  {{- with .Values.secrets.values.gatewaySessionIntegrityAuthToken }}
  {{ $.Values.secrets.keys.gatewaySessionIntegrityAuthToken }}: {{ $.Values.secrets.values.gatewaySessionIntegrityAuthToken | quote }}
  {{- end }}
  {{- with .Values.secrets.values.gatewayCompanionAuthToken }}
  {{ $.Values.secrets.keys.gatewayCompanionAuthToken }}: {{ $.Values.secrets.values.gatewayCompanionAuthToken | quote }}
  {{- end }}
  {{- with .Values.secrets.values.satelliteHubApiKey }}
  {{ $.Values.secrets.keys.satelliteHubApiKey }}: {{ $.Values.secrets.values.satelliteHubApiKey | quote }}
  {{- end }}
  {{- with .Values.secrets.values.homeAssistantToken }}
  {{ $.Values.secrets.keys.homeAssistantToken }}: {{ $.Values.secrets.values.homeAssistantToken | quote }}
  {{- end }}
  {{- with .Values.secrets.values.satelliteHubControlToken }}
  {{ $.Values.secrets.keys.satelliteHubControlToken }}: {{ $.Values.secrets.values.satelliteHubControlToken | quote }}
  {{- end }}
  {{- with (include "psfn.satelliteApiKeysValue" .) }}
  {{ $.Values.secrets.keys.satelliteApiKeys }}: {{ include "psfn.satelliteApiKeysValue" $ | quote }}
  {{- end }}
  {{- with .Values.secrets.values.openRouterApiKey }}
  {{ $.Values.secrets.keys.openRouterApiKey }}: {{ $.Values.secrets.values.openRouterApiKey | quote }}
  {{- end }}
  {{- with .Values.secrets.values.providerApiKey }}
  {{ $.Values.secrets.keys.providerApiKey }}: {{ $.Values.secrets.values.providerApiKey | quote }}
  {{- end }}
  {{- with .Values.secrets.values.openAiApiKey }}
  {{ $.Values.secrets.keys.openAiApiKey }}: {{ $.Values.secrets.values.openAiApiKey | quote }}
  {{- end }}
  {{- with .Values.secrets.values.backupEncryptionKey }}
  {{ $.Values.secrets.keys.backupEncryptionKey }}: {{ $.Values.secrets.values.backupEncryptionKey | quote }}
  {{- end }}
  {{- with .Values.secrets.values.embeddingApiKey }}
  {{ $.Values.secrets.keys.embeddingApiKey }}: {{ $.Values.secrets.values.embeddingApiKey | quote }}
  {{- end }}
  {{- with .Values.secrets.values.hfToken }}
  {{ $.Values.secrets.keys.hfToken }}: {{ $.Values.secrets.values.hfToken | quote }}
  {{- end }}
  {{- with .Values.secrets.values.discordToken }}
  {{ $.Values.secrets.keys.discordToken }}: {{ $.Values.secrets.values.discordToken | quote }}
  {{- end }}
  {{- with .Values.secrets.values.discordBotId }}
  {{ $.Values.secrets.keys.discordBotId }}: {{ $.Values.secrets.values.discordBotId | quote }}
  {{- end }}
  {{- with .Values.secrets.values.deepgramApiKey }}
  {{ $.Values.secrets.keys.deepgramApiKey }}: {{ $.Values.secrets.values.deepgramApiKey | quote }}
  {{- end }}
  {{- with .Values.secrets.values.elevenLabsApiKey }}
  {{ $.Values.secrets.keys.elevenLabsApiKey }}: {{ $.Values.secrets.values.elevenLabsApiKey | quote }}
  {{- end }}
  {{- with .Values.secrets.values.falApiKey }}
  {{ $.Values.secrets.keys.falApiKey }}: {{ $.Values.secrets.values.falApiKey | quote }}
  {{- end }}
  {{- with .Values.secrets.values.ntfyToken }}
  {{ $.Values.secrets.keys.ntfyToken }}: {{ $.Values.secrets.values.ntfyToken | quote }}
  {{- end }}
---
{{- end }}
{{- if and .Values.postgres.enabled (not .Values.postgres.external.enabled) (not .Values.postgres.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "psfn.postgresSecretName" . }}
  annotations:
    # A later switch to postgres.auth.existingSecret removes this object from
    # the manifest. Keep it orphaned so Helm pruning cannot delete live credentials.
    helm.sh/resource-policy: keep
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.auth.keys.password }}: {{ .Values.postgres.auth.password | quote }}
  {{ .Values.postgres.auth.keys.databaseUrl }}: {{ printf "postgresql://%s:%s@%s:%v/%s" .Values.postgres.auth.username .Values.postgres.auth.password (include "psfn.postgresServiceName" .) .Values.ports.postgres .Values.postgres.auth.database | quote }}
---
{{- end }}
{{- if and .Values.redis.enabled (eq .Values.redis.mode "internal") (not .Values.redis.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "psfn.redisSecretName" . }}
  annotations:
    # A later switch to redis.auth.existingSecret removes this object from the
    # manifest. Keep it orphaned so Helm pruning cannot delete live credentials.
    helm.sh/resource-policy: keep
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.redis.auth.key }}: {{ .Values.redis.auth.password | quote }}
{{- end }}
