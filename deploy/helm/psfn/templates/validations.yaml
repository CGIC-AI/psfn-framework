{{- range $index, $companion := .Values.fleet.companions -}}
{{- $companionId := $companion.companionId | default "" -}}
{{- if not (regexMatch "^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" $companionId) -}}
