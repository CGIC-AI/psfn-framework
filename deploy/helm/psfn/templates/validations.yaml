{{- end -}}
{{- $first := index .Values.fleet.companions 0 -}}
{{- $firstCompanionDir := printf "%s/companions/%s" .Values.fleet.runtimeRoot $first.companionId -}}
{{- $firstWorkspace := printf "%s/workspaces/personal/%s" .Values.fleet.runtimeRoot $first.companionId -}}
