{{- end -}}
{{- if not $companionClaim -}}
{{- $companionClaim = include "psfn.companionDataClaimName" $ -}}
{{- end -}}
{{- if hasKey $gatewayCompanionClaims $companionClaim -}}
{{- fail (printf "fleet companionDataClaim is duplicated: %s" $companionClaim) -}}
{{- end -}}
{{- $_ := set $gatewayCompanionClaims $companionClaim true -}}
{{- $workspaceClaim := $companion.workspaceClaim | default "" -}}
{{- if and (not $workspaceClaim) (gt $index 0) -}}
{{- fail (printf "fleet.companions[%d].workspaceClaim is required" $index) -}}
{{- end -}}
{{- if not $workspaceClaim -}}
{{- $workspaceClaim = include "psfn.workspaceClaimName" $ -}}
{{- end -}}
{{- if hasKey $workspaceClaims $workspaceClaim -}}
{{- fail (printf "fleet workspaceClaim is duplicated: %s" $workspaceClaim) -}}
{{- end -}}
{{- $_ := set $workspaceClaims $workspaceClaim true -}}
{{- $authSecretName := $companion.authSecret.name | default "" -}}
