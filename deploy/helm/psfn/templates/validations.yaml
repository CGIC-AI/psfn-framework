{{- end -}}
{{- if hasKey $authSecrets $authSecretName -}}
{{- fail (printf "fleet authSecret.name is duplicated: %s" $authSecretName) -}}
{{- end -}}
{{- $_ := set $authSecrets $authSecretName true -}}
