{{- $serviceName := include "psfn.fleetAgentAdminServiceName" (dict "root" $ "companionId" $companionId) -}}
{{- $deploymentName := include "psfn.fleetAgentDeploymentName" (dict "root" $ "companionId" $companionId) -}}
{{- if or (gt (len $serviceName) 63) (not (regexMatch "^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$" $serviceName)) -}}
{{- fail (printf "fleet companion %s derives invalid admin Service name %s" $companionId $serviceName) -}}
{{- end -}}
{{- if or (gt (len $deploymentName) 63) (not (regexMatch "^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$" $deploymentName)) -}}
