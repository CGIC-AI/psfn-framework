{{- if $.Values.emosim.enabled -}}
{{- $emosimTarget := dict "root" $ "companionId" $companionId -}}
{{- $emosimServiceName := include "psfn.fleetEmosimServiceName" $emosimTarget -}}
{{- $emosimClaimName := include "psfn.fleetEmosimStateClaimName" $emosimTarget -}}
{{- if or (gt (len $emosimServiceName) 63) (not (regexMatch "^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$" $emosimServiceName)) -}}
{{- fail (printf "fleet companion %s derives invalid EmoSim Service name %s" $companionId $emosimServiceName) -}}
