{{- fail (printf "fleet.companions[%d].authSecret.sessionIntegrityKey is required" $index) -}}
{{- end -}}
{{- if and (not ($companion.authSecret.companionAuthKey | default "")) (gt $index 0) -}}
{{- fail (printf "fleet.companions[%d].authSecret.companionAuthKey is required" $index) -}}
