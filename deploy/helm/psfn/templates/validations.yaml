{{- if not .Values.certificates.enabled -}}
{{- fail "certificates.enabled must be true because PSFN Kubernetes network transports require mTLS certificates" -}}
{{- end -}}
{{- if and .Values.ownerMigration.required (not .Values.ownerMigration.enabled) -}}
{{- fail "ownerMigration.required=true requires ownerMigration.enabled=true" -}}
{{- end -}}
{{- if .Values.ownerMigration.enabled -}}
{{- if .Values.bootstrap.seedOwnerFiles -}}
{{- fail "ownerMigration.enabled=true requires bootstrap.seedOwnerFiles=false" -}}
{{- end -}}
{{- if lt (len .Values.ownerMigration.companions) 1 -}}
{{- fail "ownerMigration.enabled=true requires at least one explicit companion PVC" -}}
{{- end -}}
{{- if not .Values.ownerMigration.systemDataClaim -}}
{{- fail "ownerMigration.systemDataClaim is required when ownerMigration.enabled=true" -}}
{{- end -}}
{{- if not .Values.ownerMigration.backupsClaim -}}
{{- fail "ownerMigration.backupsClaim is required when ownerMigration.enabled=true" -}}
{{- end -}}
{{- if not (hasPrefix "/" .Values.ownerMigration.runtimeRoot) -}}
{{- fail "ownerMigration.runtimeRoot must be absolute" -}}
{{- end -}}
{{- if not (hasPrefix (printf "%s/" (trimSuffix "/" .Values.ownerMigration.runtimeRoot)) .Values.ownerMigration.systemDataDir) -}}
{{- fail "ownerMigration.systemDataDir must be beneath ownerMigration.runtimeRoot" -}}
{{- end -}}
{{- if not (hasPrefix "/" .Values.ownerMigration.backupsDir) -}}
{{- fail "ownerMigration.backupsDir must be absolute" -}}
{{- end -}}
{{- if not (hasPrefix (printf "%s/" (trimSuffix "/" .Values.ownerMigration.backupsDir)) .Values.ownerMigration.snapshotOutputDir) -}}
{{- fail "ownerMigration.snapshotOutputDir must be beneath ownerMigration.backupsDir" -}}
{{- end -}}
{{- if and .Values.ownerMigration.backupsSubPath (or (hasPrefix "/" .Values.ownerMigration.backupsSubPath) (contains ".." .Values.ownerMigration.backupsSubPath) (not (regexMatch "^([A-Za-z0-9._-]+/)*[A-Za-z0-9._-]+$" .Values.ownerMigration.backupsSubPath))) -}}
{{- fail "ownerMigration.backupsSubPath must be a safe relative PVC subPath" -}}
{{- end -}}
{{- if not .Values.ownerMigration.verification.enabled -}}
{{- fail "ownerMigration.enabled=true requires ownerMigration.verification.enabled=true" -}}
{{- end -}}
{{- if eq (len .Values.ownerMigration.approvals) 0 -}}
{{- fail "ownerMigration.approvals must bind every legacy owner source digest" -}}
{{- end -}}
{{- range $ownerFile, $digest := .Values.ownerMigration.approvals -}}
{{- if not (has $ownerFile (list "charge-policy.json" "skills.json")) -}}
{{- fail (printf "ownerMigration.approvals contains an unsupported fleet-migration owner: %s" $ownerFile) -}}
{{- end -}}
{{- if not (regexMatch "^[a-f0-9]{64}$" $digest) -}}
{{- fail (printf "ownerMigration.approvals.%s must be an exact lowercase SHA-256" $ownerFile) -}}
{{- end -}}
{{- end -}}
{{- $claims := dict -}}
{{- $paths := dict -}}
{{- $ids := dict -}}
{{- range $index, $companion := .Values.ownerMigration.companions -}}
{{- if not $companion.companionId -}}
{{- fail (printf "ownerMigration.companions[%d].companionId is required" $index) -}}
{{- end -}}
{{- if not $companion.claimName -}}
{{- fail (printf "ownerMigration.companions[%d].claimName is required" $index) -}}
{{- end -}}
{{- if not (hasPrefix (printf "%s/companions/" (trimSuffix "/" $.Values.ownerMigration.runtimeRoot)) $companion.mountPath) -}}
{{- fail (printf "ownerMigration.companions[%d].mountPath must be beneath <runtimeRoot>/companions" $index) -}}
{{- end -}}
{{- if hasKey $claims $companion.claimName -}}
{{- fail (printf "ownerMigration companion claimName is duplicated: %s" $companion.claimName) -}}
{{- end -}}
{{- if hasKey $paths $companion.mountPath -}}
{{- fail (printf "ownerMigration companion mountPath is duplicated: %s" $companion.mountPath) -}}
{{- end -}}
{{- if hasKey $ids $companion.companionId -}}
{{- fail (printf "ownerMigration companionId is duplicated: %s" $companion.companionId) -}}
{{- end -}}
{{- $_ := set $claims $companion.claimName true -}}
{{- $_ := set $paths $companion.mountPath true -}}
{{- $_ := set $ids $companion.companionId true -}}
{{- if $.Values.ownerMigration.verification.enabled -}}
{{- if not (regexMatch "^[a-f0-9]{64}$" ($companion.expectedIdentitySha256 | default "")) -}}
{{- fail (printf "ownerMigration.companions[%d].expectedIdentitySha256 must be an exact lowercase SHA-256" $index) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and .Values.ownerMigration.verification.enabled (or (lt (int .Values.ownerMigration.verification.initialChargeQuota) 1) (lt (int .Values.ownerMigration.verification.initialMaxLoadedSkills) 1)) -}}
{{- fail "ownerMigration verification initial values must be positive integers" -}}
{{- end -}}
{{- $migrationDigest := default .Values.psfnAppImage.digest .Values.workloads.agent.image.digest -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $migrationDigest) -}}
{{- fail "ownerMigration requires an exact psfnAppImage/workloads.agent image digest" -}}
{{- end -}}
{{- end -}}
{{- if and .Values.certificates.enabled (not .Values.certificates.issuer.create) (not .Values.certificates.issuer.existingIssuerRef.name) (not .Values.certificates.issuer.name) -}}
{{- fail "certificates.issuer.existingIssuerRef.name or certificates.issuer.name is required when certificates.issuer.create=false" -}}
{{- end -}}
{{- if and .Values.certificates.issuer.create .Values.certificates.issuer.existingIssuerRef.name -}}
{{- fail "certificates.issuer.existingIssuerRef.name must be empty when certificates.issuer.create=true" -}}
{{- end -}}
{{- /* The generated CA secret is namespaced to the release, but cert-manager resolves
ClusterIssuer CA secrets in its cluster-resource namespace, so a chart-created CA can
never back a ClusterIssuer. */ -}}
{{- if and .Values.certificates.issuer.create (ne .Values.certificates.issuer.kind "Issuer") -}}
{{- fail "certificates.issuer.kind must be Issuer when certificates.issuer.create=true; use certificates.issuer.existingIssuerRef for a ClusterIssuer" -}}
{{- end -}}
{{- if and (not .Values.postgres.enabled) (not .Values.postgres.external.enabled) -}}
{{- fail "postgres.enabled=false requires postgres.external.enabled=true with an existing database URL Secret" -}}
{{- end -}}
{{- if and .Values.redis.enabled (not (or (eq .Values.redis.mode "internal") (eq .Values.redis.mode "external"))) -}}
{{- fail "redis.mode must be internal or external when redis.enabled=true" -}}
{{- end -}}
{{- if and .Values.redis.enabled (eq .Values.redis.mode "external") (not .Values.redis.external.url) -}}
{{- fail "redis.external.url is required when redis.mode=external" -}}
{{- end -}}
{{- if and .Values.liteLlm.enabled (not (or (eq .Values.liteLlm.mode "internal") (eq .Values.liteLlm.mode "external"))) -}}
{{- fail "liteLlm.mode must be internal or external when liteLlm.enabled=true" -}}
{{- end -}}
{{- if and .Values.liteLlm.enabled (eq .Values.liteLlm.mode "external") (not .Values.liteLlm.external.baseUrl) -}}
{{- fail "liteLlm.external.baseUrl is required when liteLlm.mode=external" -}}
{{- end -}}
{{- if and .Values.liteLlm.enabled .Values.secrets.create (not .Values.secrets.existingSecret) (not .Values.secrets.allowMissingRequired) -}}
{{- $_ := required "secrets.values.liteLlmApiKey is required for liteLlm.enabled=true when secrets.allowMissingRequired=false" .Values.secrets.values.liteLlmApiKey -}}
{{- end -}}
{{- if .Values.repositoryCheckout.enabled -}}
{{- if not .Values.repositoryCheckout.mountPath -}}
{{- fail "repositoryCheckout.mountPath is required when repositoryCheckout.enabled=true" -}}
{{- end -}}
{{- $hasHostPath := ne (default "" .Values.repositoryCheckout.hostPath.path) "" -}}
{{- $hasPvc := ne (default "" .Values.repositoryCheckout.persistentVolumeClaim.claimName) "" -}}
{{- if eq $hasHostPath $hasPvc -}}
{{- fail "repositoryCheckout.enabled=true requires exactly one of repositoryCheckout.hostPath.path or repositoryCheckout.persistentVolumeClaim.claimName" -}}
{{- end -}}
{{- if and $hasHostPath (not (has .Values.repositoryCheckout.hostPath.type (list "" "Directory" "DirectoryOrCreate"))) -}}
{{- fail "repositoryCheckout.hostPath.type must be empty, Directory, or DirectoryOrCreate" -}}
{{- end -}}
{{- end -}}
{{- if .Values.kubeSelfManagement.enabled -}}
{{- if not (regexMatch "^[a-f0-9]{40}$" (.Values.psfnAppImage.gitCommit | default "")) -}}
{{- fail "psfnAppImage.gitCommit must be an exact 40-character Git revision when kubeSelfManagement.enabled=true" -}}
{{- end -}}
{{- $gatewayTag := default .Values.psfnAppImage.tag .Values.workloads.gateway.image.tag -}}
{{- $gatewayDigest := default .Values.psfnAppImage.digest .Values.workloads.gateway.image.digest -}}
{{- if and (not $gatewayTag) (not $gatewayDigest) -}}
{{- fail "gateway image tag or digest is required when kubeSelfManagement.enabled=true" -}}
{{- end -}}
{{- if and $gatewayTag (has (lower $gatewayTag) (list "latest" "main" "main-latest")) -}}
{{- fail "gateway image tag must be pinned when kubeSelfManagement.enabled=true" -}}
{{- end -}}
{{- if and $gatewayDigest (not (regexMatch "^sha256:[a-f0-9]{64}$" $gatewayDigest)) -}}
{{- fail "gateway image digest must be sha256:<64 lowercase hex> when kubeSelfManagement.enabled=true" -}}
{{- end -}}
{{- with .Values.kubeSelfManagement.serviceAccountName -}}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" .) -}}
{{- fail "kubeSelfManagement.serviceAccountName must be a DNS label" -}}
{{- end -}}
{{- end -}}
{{- if eq (include "psfn.kubeSelfManagementServiceAccountName" .) (include "psfn.serviceAccountName" .) -}}
{{- fail "kubeSelfManagement.serviceAccountName must be dedicated to the gateway" -}}
{{- end -}}
{{- if and .Values.networkPolicy.enabled (eq (len .Values.kubeSelfManagement.apiServerCIDRs) 0) -}}
{{- fail "kubeSelfManagement.apiServerCIDRs must contain the Kubernetes API Service host CIDR when networkPolicy.enabled=true" -}}
{{- end -}}
{{- range .Values.kubeSelfManagement.apiServerCIDRs -}}
{{- if not (or (regexMatch "^([0-9]{1,3}\\.){3}[0-9]{1,3}/32$" .) (regexMatch "^[0-9A-Fa-f:]+/128$" .)) -}}
{{- fail "kubeSelfManagement.apiServerCIDRs entries must be single-host IPv4 /32 or IPv6 /128 CIDRs" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if .Values.beads.allowActions -}}
{{- range .Values.beads.allowActions -}}
{{- if not (has . (list "ready" "show" "create" "update" "close" "sync")) -}}
{{- fail "beads.allowActions entries must be one of: ready, show, create, update, close, sync" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) (not .Values.secrets.allowMissingRequired) -}}
{{- $_ := required "secrets.values.backupEncryptionKey is required when secrets.allowMissingRequired=false" .Values.secrets.values.backupEncryptionKey -}}
{{- end -}}
{{- if .Values.modelPrefetch.enabled -}}
{{- if not .Values.persistence.modelCache.enabled -}}
{{- fail "modelPrefetch.enabled=true requires persistence.modelCache.enabled=true" -}}
{{- end -}}
{{- if not .Values.modelPrefetch.textEmotion.enabled -}}
{{- fail "modelPrefetch.enabled=true requires modelPrefetch.textEmotion.enabled=true until another prefetch target is configured" -}}
{{- end -}}
{{- if not .Values.modelPrefetch.textEmotion.model -}}
{{- fail "modelPrefetch.textEmotion.model is required when modelPrefetch.enabled=true" -}}
{{- end -}}
{{- if not (has .Values.modelPrefetch.textEmotion.dtype (list "auto" "fp32" "fp16" "q8" "int8" "uint8" "q4" "bnb4" "q4f16")) -}}
{{- fail "modelPrefetch.textEmotion.dtype must be one of: auto, fp32, fp16, q8, int8, uint8, q4, bnb4, q4f16" -}}
{{- end -}}
{{- end -}}
{{- if and .Values.satelliteHub.enabled (ne .Values.satelliteHub.agentRuntime "psfn") -}}
{{- fail "satelliteHub.agentRuntime must be psfn so the hub uses the in-cluster Gateway Service" -}}
{{- end -}}
{{- if and .Values.satelliteHub.enabled .Values.satelliteHub.homeAssistant.enabled .Values.networkPolicy.enabled -}}
{{- if eq (len .Values.satelliteHub.homeAssistant.egressCIDRs) 0 -}}
{{- fail "satelliteHub.homeAssistant.egressCIDRs must list the trusted Home Assistant host/subnet when networkPolicy.enabled=true" -}}
{{- end -}}
{{- if or (lt (int .Values.satelliteHub.homeAssistant.egressPort) 1) (gt (int .Values.satelliteHub.homeAssistant.egressPort) 65535) -}}
{{- fail "satelliteHub.homeAssistant.egressPort must be within 1-65535" -}}
{{- end -}}
{{- end -}}
{{- if and .Values.satelliteHub.enabled (not .Values.satelliteHub.textOnly) .Values.secrets.create (not .Values.secrets.existingSecret) (not .Values.secrets.allowMissingRequired) -}}
{{- $_ := required "secrets.values.deepgramApiKey is required for satelliteHub.enabled=true with satelliteHub.textOnly=false when secrets.allowMissingRequired=false" .Values.secrets.values.deepgramApiKey -}}
{{- $_ := required "secrets.values.elevenLabsApiKey is required for satelliteHub.enabled=true with satelliteHub.textOnly=false when secrets.allowMissingRequired=false" .Values.secrets.values.elevenLabsApiKey -}}
{{- end -}}
{{- if and .Values.satelliteHub.enabled .Values.secrets.create (not .Values.secrets.existingSecret) (not .Values.secrets.allowMissingRequired) -}}
{{- $_ := required "secrets.values.satelliteHubApiKey is required for satelliteHub.enabled=true when secrets.allowMissingRequired=false (dedicated satellite-scoped credential; never reuse the shared API_KEY)" .Values.secrets.values.satelliteHubApiKey -}}
{{- end -}}
{{- with .Values.secrets.values.satelliteHubApiKey -}}
{{- if lt (len (trim .)) 16 -}}
{{- fail "secrets.values.satelliteHubApiKey must be at least 16 characters (gateway API_SATELLITE_KEYS minimum)" -}}
{{- end -}}
{{- if or (eq (trim .) ($.Values.secrets.values.apiKey | default "")) (eq (trim .) ($.Values.secrets.values.adminToken | default "")) -}}
{{- fail "secrets.values.satelliteHubApiKey must not reuse secrets.values.apiKey or secrets.values.adminToken" -}}
{{- end -}}
{{- end -}}
{{- range splitList "," (.Values.secrets.values.extraSatelliteApiKeys | default "") -}}
{{- $entry := trim . -}}
{{- if and $entry (lt (len $entry) 16) -}}
{{- fail "secrets.values.extraSatelliteApiKeys entries must each be at least 16 characters" -}}
{{- end -}}
{{- end -}}
{{- if .Values.fleetAuth.enabled -}}
{{- if not (regexMatch "^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" .Values.runtime.companionId) -}}
{{- fail "fleetAuth.enabled=true requires runtime.companionId to be one lowercase RFC4122 UUID" -}}
{{- end -}}
{{- if or (not .Values.ingress.enabled) (not .Values.ingress.gateway.enabled) -}}
{{- fail "fleetAuth.enabled=true requires the Gateway Ingress as the sole browser origin" -}}
{{- end -}}
{{- if not .Values.ingress.gateway.tls.enabled -}}
{{- fail "fleetAuth.enabled=true requires ingress.gateway.tls.enabled=true" -}}
{{- end -}}
{{- if not (trim .Values.ingress.gateway.tls.secretName) -}}
{{- fail "fleetAuth.enabled=true requires ingress.gateway.tls.secretName" -}}
{{- end -}}
{{- if not .Values.networkPolicy.enabled -}}
{{- fail "fleetAuth.enabled=true requires networkPolicy.enabled=true" -}}
{{- end -}}
{{- if .Values.hostPorts.gatewayApi.enabled -}}
{{- fail "fleetAuth.enabled=true forbids hostPorts.gatewayApi.enabled=true" -}}
{{- end -}}
{{- if or (ne .Values.ingress.gateway.path "/") (ne .Values.ingress.gateway.pathType "Prefix") -}}
{{- fail "fleetAuth.enabled=true requires ingress.gateway.path=/ and pathType=Prefix" -}}
{{- end -}}
{{- end -}}
{{- if .Values.companionUiTest.enabled -}}
{{- if not .Values.fleetAuth.enabled -}}
{{- fail "companionUiTest.enabled=true requires fleetAuth.enabled=true for the canonical login/session origin" -}}
{{- end -}}
{{- if not .Values.satelliteHub.enabled -}}
{{- fail "companionUiTest.enabled=true requires satelliteHub.enabled=true for server-owned device authority" -}}
{{- end -}}
{{- if not (has .Values.companionUiTest.guestMode (list "disabled" "explicit")) -}}
{{- fail "companionUiTest.guestMode must be disabled or explicit" -}}
{{- end -}}
{{- if ne .Values.companionUiTest.service.type "ClusterIP" -}}
{{- fail "companionUiTest.service.type must be ClusterIP; browser access is gateway-mediated" -}}
{{- end -}}
{{- end -}}
