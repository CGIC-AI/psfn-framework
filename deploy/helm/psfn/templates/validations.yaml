{{- if hasKey $databaseUrlSecretKeys $databaseUrlSecretKey -}}
{{- fail (printf "fleet databaseUrlSecretKey is duplicated: %s" $databaseUrlSecretKey) -}}
{{- end -}}
{{- $_ := set $databaseUrlSecretKeys $databaseUrlSecretKey true -}}
{{- end -}}
{{- $companionClaim := $companion.companionDataClaim | default "" -}}
