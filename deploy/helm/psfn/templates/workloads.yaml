apiVersion: v1
kind: Service
metadata:
  name: {{ include "psfn.gatewayApiServiceName" . }}
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http-api
      port: {{ .Values.ports.gatewayApi }}
      targetPort: http-api
  selector:
    {{- include "psfn.componentLabels" (dict "root" . "component" "gateway") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "psfn.gatewayRpcServiceName" . }}
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: gateway-rpc
      port: {{ .Values.ports.gatewayRpc }}
      targetPort: gateway-rpc
  selector:
    {{- include "psfn.componentLabels" (dict "root" . "component" "gateway") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "psfn.fullname" . }}-gateway
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.workloads.gateway.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "psfn.componentLabels" (dict "root" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "psfn.componentLabels" (dict "root" . "component" "gateway") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "psfn.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "psfn.seedInitContainer" . | nindent 8 }}
        {{- include "psfn.waitForPostgresInitContainer" (dict "root" . "image" .Values.workloads.gateway.image) | nindent 8 }}
      containers:
        - name: gateway
          image: {{ include "psfn.image" (dict "root" . "image" .Values.workloads.gateway.image) | quote }}
          imagePullPolicy: {{ default .Values.psfnAppImage.pullPolicy .Values.workloads.gateway.image.pullPolicy }}
          command:
            {{- toYaml .Values.workloads.gateway.command | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http-api
              containerPort: {{ .Values.ports.gatewayApi }}
              {{- if .Values.hostPorts.gatewayApi.enabled }}
              hostPort: {{ .Values.hostPorts.gatewayApi.port }}
              {{- with .Values.hostPorts.gatewayApi.hostIP }}
              hostIP: {{ . | quote }}
              {{- end }}
              {{- end }}
            - name: gateway-rpc
              containerPort: {{ .Values.ports.gatewayRpc }}
          env:
            {{- include "psfn.commonEnv" . | nindent 12 }}
            {{- include "psfn.providerSecretEnv" . | nindent 12 }}
            {{- if .Values.persistence.modelCache.enabled }}
            - name: PSFN_INJECTION_MODEL_DIR
              value: {{ printf "%s/prompt-injection-v2" .Values.runtime.modelCacheDir | quote }}
            {{- end }}
            {{- if .Values.liteLlm.enabled }}
            - name: LITELLM_BASE_URL
              value: {{ include "psfn.liteLlmBaseUrl" . | quote }}
            {{- end }}
            - name: API_HOST
              value: 0.0.0.0
            - name: API_PORT
              value: {{ .Values.ports.gatewayApi | quote }}
            - name: ADMIN_HOST
              value: {{ include "psfn.gardenServiceName" . | quote }}
            - name: ADMIN_PORT
              value: {{ .Values.ports.garden | quote }}
            - name: GATEWAY_SESSION_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "psfn.appSecretName" . }}
                  key: {{ .Values.secrets.keys.gatewaySessionHmacKey }}
            {{- if and .Values.satelliteHub.enabled .Values.satelliteHub.homeAssistant.enabled }}
            - name: SATELLITE_HUB_CONTROL_BASE_URL
              value: {{ printf "http://%s:%v" (include "psfn.satelliteHubServiceName" .) .Values.ports.satelliteHubControl | quote }}
            - name: SATELLITE_HUB_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "psfn.appSecretName" . }}
                  key: {{ .Values.secrets.keys.satelliteHubControlToken }}
            {{- end }}
            {{- /* Per-satellite bearer keys (Sprint-10 H4): each key yields a
                 distinct satellite-scoped principal referenced by
                 satellites.json auth.apiKeyPrincipalIds. Optional like the
                 provider secrets: when absent, no satellite-scoped principal
                 exists and satellite endpoints reject those credentials. */}}
            - name: API_SATELLITE_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "psfn.appSecretName" . }}
                  key: {{ .Values.secrets.keys.satelliteApiKeys }}
                  optional: true
            - name: GATEWAY_RPC_ENDPOINT
              value: {{ include "psfn.gatewayRpcUrlForServer" . | quote }}
            - name: GATEWAY_RPC_TLS_CA_PATH
              value: {{ printf "%s/gateway-rpc/ca.crt" .Values.certificates.mountBasePath | quote }}
            - name: GATEWAY_RPC_TLS_CERT_PATH
              value: {{ printf "%s/gateway-rpc/tls.crt" .Values.certificates.mountBasePath | quote }}
            - name: GATEWAY_RPC_TLS_KEY_PATH
              value: {{ printf "%s/gateway-rpc/tls.key" .Values.certificates.mountBasePath | quote }}
            - name: GATEWAY_RPC_TLS_EXPECTED_PEER_SPIFFE_URI
              value: {{ include "psfn.spiffeAgent" . | quote }}
          readinessProbe:
            tcpSocket:
              port: http-api
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http-api
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.workloads.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: system-data
              mountPath: {{ .Values.runtime.systemDataDir }}
            - name: companion-data
              mountPath: {{ .Values.runtime.companionDataDir }}
              readOnly: true
            # Gateway owns CogSec quarantine/event writes under state while
            # the rest of companion-data remains read-only.
            - name: companion-data
              mountPath: {{ printf "%s/state" .Values.runtime.companionDataDir }}
              subPath: state
            - name: workspace
              mountPath: {{ .Values.runtime.workspacePath }}
            - name: runtime
              mountPath: {{ .Values.runtime.logsDir }}
              subPath: logs
            - name: runtime
              mountPath: {{ .Values.runtime.tempDir }}
              subPath: tmp
            {{- if .Values.persistence.modelCache.enabled }}
            - name: model-cache
              mountPath: {{ .Values.runtime.modelCacheDir }}
            {{- end }}
            {{- include "psfn.repositoryCheckoutVolumeMount" . | nindent 12 }}
            - name: gateway-rpc-tls
              mountPath: {{ printf "%s/gateway-rpc" .Values.certificates.mountBasePath }}
              readOnly: true
      volumes:
        {{- include "psfn.commonVolumes" . | nindent 8 }}
        - name: gateway-rpc-tls
          secret:
            secretName: {{ include "psfn.gatewayRpcCertSecretName" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "psfn.agentAdminServiceName" . }}
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: admin-https
      port: {{ .Values.ports.agentAdmin }}
      targetPort: admin-https
  selector:
    {{- include "psfn.componentLabels" (dict "root" . "component" "agent") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "psfn.fullname" . }}-agent
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.workloads.agent.replicaCount }}
  # Recreate guarantees a single live agent instance: a RollingUpdate window
  # briefly runs two agents against one gateway, risking double-handling of
  # partner messages. Identity is single-instance by design.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "psfn.componentLabels" (dict "root" . "component" "agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "psfn.componentLabels" (dict "root" . "component" "agent") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "psfn.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "psfn.seedInitContainer" . | nindent 8 }}
        {{- include "psfn.waitForPostgresInitContainer" (dict "root" . "image" .Values.workloads.agent.image) | nindent 8 }}
      containers:
        - name: agent
          image: {{ include "psfn.image" (dict "root" . "image" .Values.workloads.agent.image) | quote }}
          imagePullPolicy: {{ default .Values.psfnAppImage.pullPolicy .Values.workloads.agent.image.pullPolicy }}
          command:
            {{- toYaml .Values.workloads.agent.command | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: admin-https
              containerPort: {{ .Values.ports.agentAdmin }}
          env:
            {{- include "psfn.commonEnv" . | nindent 12 }}
            - name: PSFN_HELM_BACKUP_AGENT_IMAGE_REPOSITORY
              value: {{ default .Values.psfnAppImage.repository .Values.workloads.agent.image.repository | quote }}
            - name: PSFN_HELM_BACKUP_AGENT_IMAGE_TAG
              value: {{ default .Values.psfnAppImage.tag .Values.workloads.agent.image.tag | quote }}
            - name: PSFN_HELM_BACKUP_AGENT_IMAGE_DIGEST
              value: {{ default .Values.psfnAppImage.digest .Values.workloads.agent.image.digest | quote }}
            - name: PSFN_HELM_BACKUP_GATEWAY_IMAGE_REPOSITORY
              value: {{ default .Values.psfnAppImage.repository .Values.workloads.gateway.image.repository | quote }}
            - name: PSFN_HELM_BACKUP_GATEWAY_IMAGE_TAG
              value: {{ default .Values.psfnAppImage.tag .Values.workloads.gateway.image.tag | quote }}
            - name: PSFN_HELM_BACKUP_GATEWAY_IMAGE_DIGEST
              value: {{ default .Values.psfnAppImage.digest .Values.workloads.gateway.image.digest | quote }}
            - name: PSFN_HELM_BACKUP_GARDEN_IMAGE_REPOSITORY
              value: {{ default .Values.psfnAppImage.repository .Values.workloads.garden.image.repository | quote }}
            - name: PSFN_HELM_BACKUP_GARDEN_IMAGE_TAG
              value: {{ default .Values.psfnAppImage.tag .Values.workloads.garden.image.tag | quote }}
            - name: PSFN_HELM_BACKUP_GARDEN_IMAGE_DIGEST
              value: {{ default .Values.psfnAppImage.digest .Values.workloads.garden.image.digest | quote }}
            - name: GATEWAY_RPC_ENDPOINT
              value: {{ include "psfn.gatewayRpcUrlForClient" . | quote }}
            - name: GATEWAY_SESSION_INTEGRITY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "psfn.appSecretName" . }}
                  key: {{ .Values.secrets.keys.gatewaySessionIntegrityAuthToken }}
            - name: GATEWAY_RPC_TLS_CA_PATH
              value: {{ printf "%s/gateway-rpc/ca.crt" .Values.certificates.mountBasePath | quote }}
            - name: GATEWAY_RPC_TLS_CERT_PATH
              value: {{ printf "%s/gateway-rpc/tls.crt" .Values.certificates.mountBasePath | quote }}
            - name: GATEWAY_RPC_TLS_KEY_PATH
              value: {{ printf "%s/gateway-rpc/tls.key" .Values.certificates.mountBasePath | quote }}
            - name: GATEWAY_RPC_TLS_EXPECTED_PEER_SPIFFE_URI
              value: {{ include "psfn.spiffeGateway" . | quote }}
            - name: GATEWAY_RPC_TLS_SERVER_NAME
              value: {{ include "psfn.gatewayRpcServerName" . | quote }}
            - name: ADMIN_TRANSPORT_MODE
              value: network
            - name: ADMIN_TRANSPORT_LISTEN_HOST
              value: 0.0.0.0
            - name: ADMIN_TRANSPORT_LISTEN_PORT
              value: {{ .Values.ports.agentAdmin | quote }}
            - name: ADMIN_TRANSPORT_TLS_CA_PATH
              value: {{ printf "%s/admin-transport/ca.crt" .Values.certificates.mountBasePath | quote }}
            - name: ADMIN_TRANSPORT_TLS_CERT_PATH
              value: {{ printf "%s/admin-transport/tls.crt" .Values.certificates.mountBasePath | quote }}
            - name: ADMIN_TRANSPORT_TLS_KEY_PATH
              value: {{ printf "%s/admin-transport/tls.key" .Values.certificates.mountBasePath | quote }}
            - name: ADMIN_TRANSPORT_TLS_EXPECTED_PEER_SPIFFE_URI
              value: {{ include "psfn.spiffeGarden" . | quote }}
            {{- if .Values.redis.enabled }}
            - name: PSFN_APP_CACHE_MODE
              value: redis
            - name: PSFN_REDIS_URL
              value: {{ ternary .Values.redis.external.url (printf "redis://%s:%v" (include "psfn.redisServiceName" .) .Values.ports.redis) (eq .Values.redis.mode "external") | quote }}
            - name: PSFN_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "psfn.redisPasswordSecretName" . }}
                  key: {{ include "psfn.redisPasswordSecretKey" . }}
            {{- if and (eq .Values.redis.mode "external") .Values.redis.external.tls.enabled }}
            - name: PSFN_REDIS_TLS_REJECT_UNAUTHORIZED
              value: {{ .Values.redis.external.tls.rejectUnauthorized | quote }}
            {{- end }}
            {{- else }}
            - name: PSFN_APP_CACHE_MODE
              value: memory
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: admin-https
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: admin-https
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            {{- toYaml .Values.workloads.agent.resources | nindent 12 }}
          volumeMounts:
            - name: system-data
              mountPath: {{ .Values.runtime.systemDataDir }}
            - name: companion-data
              mountPath: {{ .Values.runtime.companionDataDir }}
            - name: workspace
              mountPath: {{ .Values.runtime.workspacePath }}
            - name: runtime
              mountPath: {{ .Values.runtime.logsDir }}
              subPath: logs
            - name: runtime
              mountPath: {{ .Values.runtime.tempDir }}
              subPath: tmp
            - name: runtime
              mountPath: {{ .Values.runtime.backupsDir }}
              subPath: backups
            {{- if .Values.persistence.modelCache.enabled }}
            - name: model-cache
              mountPath: {{ .Values.runtime.modelCacheDir }}
            {{- end }}
            {{- include "psfn.repositoryCheckoutVolumeMount" . | nindent 12 }}
            - name: gateway-rpc-client-tls
              mountPath: {{ printf "%s/gateway-rpc" .Values.certificates.mountBasePath }}
              readOnly: true
            - name: admin-transport-tls
              mountPath: {{ printf "%s/admin-transport" .Values.certificates.mountBasePath }}
              readOnly: true
      volumes:
        {{- include "psfn.commonVolumes" . | nindent 8 }}
        - name: gateway-rpc-client-tls
          secret:
            secretName: {{ include "psfn.agentRpcClientCertSecretName" . }}
        - name: admin-transport-tls
          secret:
            secretName: {{ include "psfn.agentAdminCertSecretName" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "psfn.gardenServiceName" . }}
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http-garden
      port: {{ .Values.ports.garden }}
      targetPort: http-garden
  selector:
    {{- include "psfn.componentLabels" (dict "root" . "component" "garden") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "psfn.fullname" . }}-garden
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.workloads.garden.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "psfn.componentLabels" (dict "root" . "component" "garden") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "psfn.componentLabels" (dict "root" . "component" "garden") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "psfn.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "psfn.seedInitContainer" . | nindent 8 }}
      containers:
        - name: garden
          image: {{ include "psfn.image" (dict "root" . "image" .Values.workloads.garden.image) | quote }}
          imagePullPolicy: {{ default .Values.psfnAppImage.pullPolicy .Values.workloads.garden.image.pullPolicy }}
          command:
            {{- toYaml .Values.workloads.garden.command | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http-garden
              containerPort: {{ .Values.ports.garden }}
              {{- if .Values.hostPorts.garden.enabled }}
              hostPort: {{ .Values.hostPorts.garden.port }}
              {{- with .Values.hostPorts.garden.hostIP }}
              hostIP: {{ . | quote }}
              {{- end }}
              {{- end }}
          env:
            {{- include "psfn.commonEnv" . | nindent 12 }}
            - name: ADMIN_HOST
              value: 0.0.0.0
            - name: ADMIN_PORT
              value: {{ .Values.ports.garden | quote }}
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "psfn.appSecretName" . }}
                  key: {{ .Values.secrets.keys.adminToken }}
            - name: ADMIN_TRANSPORT_MODE
              value: network
            - name: ADMIN_TRANSPORT_URL
              value: {{ include "psfn.agentAdminUrl" . | quote }}
            - name: ADMIN_TRANSPORT_TLS_CA_PATH
              value: {{ printf "%s/admin-transport/ca.crt" .Values.certificates.mountBasePath | quote }}
            - name: ADMIN_TRANSPORT_TLS_CERT_PATH
              value: {{ printf "%s/admin-transport/tls.crt" .Values.certificates.mountBasePath | quote }}
            - name: ADMIN_TRANSPORT_TLS_KEY_PATH
              value: {{ printf "%s/admin-transport/tls.key" .Values.certificates.mountBasePath | quote }}
            - name: ADMIN_TRANSPORT_TLS_EXPECTED_PEER_SPIFFE_URI
              value: {{ include "psfn.spiffeAgent" . | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http-garden
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http-garden
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.workloads.garden.resources | nindent 12 }}
          volumeMounts:
            - name: system-data
              mountPath: {{ .Values.runtime.systemDataDir }}
            - name: companion-data
              mountPath: {{ .Values.runtime.companionDataDir }}
              readOnly: true
            - name: workspace
              mountPath: {{ .Values.runtime.workspacePath }}
            - name: runtime
              mountPath: {{ .Values.runtime.tempDir }}
              subPath: tmp
            {{- include "psfn.repositoryCheckoutVolumeMount" . | nindent 12 }}
            - name: admin-transport-client-tls
              mountPath: {{ printf "%s/admin-transport" .Values.certificates.mountBasePath }}
              readOnly: true
      volumes:
        {{- include "psfn.commonVolumes" . | nindent 8 }}
        - name: admin-transport-client-tls
          secret:
            secretName: {{ include "psfn.gardenAdminClientCertSecretName" . }}
{{- if .Values.satelliteHub.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "psfn.satelliteHubServiceName" . }}
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: hub-ws
      port: {{ .Values.ports.satelliteHub }}
      targetPort: hub-ws
    {{- if .Values.satelliteHub.homeAssistant.enabled }}
    - name: hub-control
      port: {{ .Values.ports.satelliteHubControl }}
      targetPort: hub-control
    {{- end }}
  selector:
    {{- include "psfn.componentLabels" (dict "root" . "component" "satellite-hub") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "psfn.fullname" . }}-satellite-hub
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate keeps single-node hostPort rollouts from deadlocking (the old and
  # new pod would otherwise both need hostPort {{ .Values.hostPorts.satelliteHub.port }}) and guarantees one
  # live hub instance per satellite identity.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "psfn.componentLabels" (dict "root" . "component" "satellite-hub") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "psfn.componentLabels" (dict "root" . "component" "satellite-hub") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "psfn.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: satellite-hub
          image: {{ include "psfn.satelliteHubImage" . | quote }}
          imagePullPolicy: {{ .Values.satelliteHub.image.pullPolicy }}
          {{- with .Values.satelliteHub.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: hub-ws
              containerPort: {{ .Values.ports.satelliteHub }}
              {{- if .Values.hostPorts.satelliteHub.enabled }}
              hostPort: {{ .Values.hostPorts.satelliteHub.port }}
              {{- with .Values.hostPorts.satelliteHub.hostIP }}
              hostIP: {{ . | quote }}
              {{- end }}
              {{- end }}
            {{- if .Values.satelliteHub.homeAssistant.enabled }}
            - name: hub-control
              containerPort: {{ .Values.ports.satelliteHubControl }}
            {{- end }}
          env:
            - name: AGENT_RUNTIME
              value: {{ .Values.satelliteHub.agentRuntime | quote }}
            - name: REALTIME_VOICE_BIND_HOST
              value: "0.0.0.0"
            - name: REALTIME_VOICE_PORT
              value: {{ .Values.ports.satelliteHub | quote }}
            {{- if .Values.satelliteHub.textOnly }}
            - name: HUB_TEXT_ONLY
              value: "true"
            {{- end }}
            - name: PSFN_API_BASE_URL
              value: {{ include "psfn.gatewayApiBaseUrl" . | quote }}
            {{- /* Dedicated satellite-scoped credential (Sprint-10 H4); the
                 shared operator API_KEY is never handed to the hub. */}}
            - name: PSFN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "psfn.appSecretName" . }}
                  key: {{ .Values.secrets.keys.satelliteHubApiKey }}
            - name: PSFN_MODEL
              value: {{ .Values.satelliteHub.psfnModel | quote }}
            - name: PSFN_SATELLITE_ID
              value: {{ required "satelliteHub.identity.satelliteId is required when satelliteHub.enabled=true" .Values.satelliteHub.identity.satelliteId | quote }}
            - name: PSFN_ENDPOINT_ID
              value: {{ required "satelliteHub.identity.endpointId is required when satelliteHub.enabled=true" .Values.satelliteHub.identity.endpointId | quote }}
            - name: PSFN_CLAIM_TYPE
              value: {{ required "satelliteHub.identity.claimType is required when satelliteHub.enabled=true" .Values.satelliteHub.identity.claimType | quote }}
            {{- with .Values.satelliteHub.capabilityProfile }}
            - name: PSFN_CAPABILITY_PROFILE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.satelliteHub.companionBridge.enabled }}
            {{- /* Companion event relay bridge: SSE + approval/artifact relay
                 against the same in-cluster /v1 edge. The bridge API key
                 falls back to PSFN_API_KEY inside the hub (documented hub
                 behavior, commit 9999af5). */}}
            - name: PSFN_COMPANION_BASE_URL
              value: {{ include "psfn.gatewayApiBaseUrl" . | quote }}
            {{- end }}
            {{- if .Values.satelliteHub.homeAssistant.enabled }}
            - name: HOME_ASSISTANT_ENABLED
              value: "true"
            - name: HOME_ASSISTANT_BASE_URL
              value: {{ required "satelliteHub.homeAssistant.baseUrl is required when Home Assistant is enabled" .Values.satelliteHub.homeAssistant.baseUrl | quote }}
            - name: HOME_ASSISTANT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "psfn.appSecretName" . }}
                  key: {{ .Values.secrets.keys.homeAssistantToken }}
            - name: HUB_CONTROL_BIND_HOST
              value: "0.0.0.0"
            - name: HUB_CONTROL_PORT
              value: {{ .Values.ports.satelliteHubControl | quote }}
            - name: HUB_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "psfn.appSecretName" . }}
                  key: {{ .Values.secrets.keys.satelliteHubControlToken }}
            - name: HUB_DEVICE_REGISTRY_PATH
              value: /app/config/hub-devices.json
            {{- end }}
            {{- if .Values.satelliteHub.textOnly }}
            {{- /* Text-only mode: voice providers are genuinely optional
                 (HUB_TEXT_ONLY, hub commit 2b8d234). */}}
            - name: DEEPGRAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "psfn.appSecretName" . }}
                  key: {{ .Values.secrets.keys.deepgramApiKey }}
                  optional: true
            - name: ELEVENLABS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "psfn.appSecretName" . }}
                  key: {{ .Values.secrets.keys.elevenLabsApiKey }}
                  optional: true
            {{- with .Values.satelliteHub.elevenLabsVoiceId }}
            - name: ELEVENLABS_VOICE_ID
              value: {{ . | quote }}
            {{- end }}
            {{- else }}
            - name: DEEPGRAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "psfn.appSecretName" . }}
                  key: {{ .Values.secrets.keys.deepgramApiKey }}
            - name: ELEVENLABS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "psfn.appSecretName" . }}
                  key: {{ .Values.secrets.keys.elevenLabsApiKey }}
            - name: ELEVENLABS_VOICE_ID
              value: {{ required "satelliteHub.elevenLabsVoiceId is required when satelliteHub.enabled=true and satelliteHub.textOnly=false" .Values.satelliteHub.elevenLabsVoiceId | quote }}
            {{- end }}
            - name: ARTIFACT_ROOT
              value: {{ .Values.satelliteHub.artifactRoot | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: hub-ws
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: hub-ws
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.satelliteHub.resources | nindent 12 }}
          volumeMounts:
            - name: runtime
              mountPath: /app/.artifacts
              subPath: satellite-hub-artifacts
            {{- /* Staged mTLS client identity: issued and auto-renewed by
                 cert-manager now, consumed once the gateway /v1 edge runs
                 direct TLS (API_TLS_*). Until then runtime auth is the scoped
                 bearer key; see docs/satellite-hub-kube.md for the flip. */}}
            - name: psfn-client-tls
              mountPath: {{ printf "%s/psfn-client" .Values.certificates.mountBasePath }}
              readOnly: true
            {{- if .Values.satelliteHub.homeAssistant.enabled }}
            - name: hub-device-registry
              mountPath: /app/config/hub-devices.json
              subPath: hub-devices.json
              readOnly: true
            {{- end }}
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: {{ include "psfn.fullname" . }}-runtime
        - name: psfn-client-tls
          secret:
            secretName: {{ include "psfn.satelliteHubClientCertSecretName" . }}
        {{- if .Values.satelliteHub.homeAssistant.enabled }}
        - name: hub-device-registry
          configMap:
            name: {{ include "psfn.fullname" . }}-hub-devices
        {{- end }}
{{- end }}
{{- if .Values.companionUiTest.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "psfn.companionUiTestServiceName" . }}
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
spec:
  type: {{ .Values.companionUiTest.service.type }}
  ports:
    - name: http-ui
      port: {{ .Values.ports.companionUiTest }}
      targetPort: http-ui
{{- if and (eq .Values.companionUiTest.service.type "NodePort") .Values.companionUiTest.service.nodePort }}
      nodePort: {{ .Values.companionUiTest.service.nodePort }}
{{- end }}
  selector:
    {{- include "psfn.componentLabels" (dict "root" . "component" "companion-ui-test") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "psfn.fullname" . }}-companion-ui-test
  labels:
    {{- include "psfn.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "psfn.componentLabels" (dict "root" . "component" "companion-ui-test") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "psfn.componentLabels" (dict "root" . "component" "companion-ui-test") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "psfn.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: companion-ui-test
          image: {{ include "psfn.companionUiTestImage" . | quote }}
          imagePullPolicy: {{ .Values.companionUiTest.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http-ui
              containerPort: {{ .Values.ports.companionUiTest }}
          readinessProbe:
            httpGet:
              path: /
              port: http-ui
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http-ui
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.companionUiTest.resources | nindent 12 }}
{{- end }}
