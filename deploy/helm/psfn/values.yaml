nameOverride: ""
fullnameOverride: ""

imagePullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

# Opt-in gateway-owned Kubernetes self-management boundary. The dedicated
# ServiceAccount is namespace-scoped and never receives Secret or exec access.
kubeSelfManagement:
  enabled: false
  serviceAccountName: ""
  # NetworkPolicy cannot select the host-network Kubernetes API process by
  # label. Supply only the kubernetes.default Service ClusterIP as a host CIDR
  # (/32 for IPv4 or /128 for IPv6) when enabling this boundary.
  apiServerCIDRs: []

podSecurityContext:
  fsGroup: 999
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  capabilities:
    drop:
      - ALL

psfnAppImage:
  # One shared image contains dist/ plus admin-ui/build/.
  repository: localhost/psfn-framework
  tag: 0.1.0-kube
  digest: ""
  pullPolicy: IfNotPresent
  # Build provenance surfaced to the companion self-diagnosis (self_status
  # action=diagnose). gitCommit is the source commit this image was built from;
  # previousGitCommit is the commit of the previously deployed build so the
  # runtime can list the bead fixes shipped between them. Set both at build/CD
  # time; empty values are reported as "unavailable" (fail-closed, never guessed).
  gitCommit: ""
  previousGitCommit: ""

runtime:
  companionId: 11111111-1111-4111-8111-111111111111
  companionName: Companion
  mode: split
  layoutMode: production
  nodeEnv: production
  # IANA timezone for the companion's clock, scheduler wall-clock windows, and
  # temporal prompt signals. settings.json activeTimezone (when set) still wins
  # over this env-level value at runtime.
  timezone: America/New_York
  systemDataDir: /runtime/system-data
  companionDataDir: /runtime/companions/11111111-1111-4111-8111-111111111111
  workspacePath: /runtime/workspaces/personal/11111111-1111-4111-8111-111111111111
  logsDir: /runtime/logs
  tempDir: /runtime/tmp
  backupsDir: /runtime/backups
  configDir: /app/config
  characterCardPath: /runtime/companions/11111111-1111-4111-8111-111111111111/companion.json
  modelCacheDir: /app/models/transformers
  # Optional path to an authoritative source checkout mounted into the runtime.
  # When set (and a real git checkout is present), self-diagnosis distinguishes
  # it from the image-snapshot repo and derives the "fixes shipped" bead list.
  # Empty means no authoritative checkout is available (reported as unavailable).
  repositoryDir: ""

# Fleet Kubernetes topology. This is the only deployment shape: one gateway,
# one fleet Garden, and one separately addressed agent workload for every
# registered companion. A deployment with one entry is a fleet of one; adding
# entries is the only topology change. The system-data PVC must contain the
# matching canonical companions.json; these values describe workload wiring
# only and never replace that owner file.
fleet:
  enabled: true
  runtimeRoot: /runtime
  companions:
    - companionId: 11111111-1111-4111-8111-111111111111
      postgresSchema: companion_default
      # Empty on the first entry means the chart-managed release PVC.
      companionDataClaim: ""
      workspaceClaim: ""
      authSecret:
        # Empty first-entry fields resolve to the chart-managed app Secret and
        # its configured role-proof keys. Follower entries must be explicit.
        name: ""
        sessionIntegrityKey: ""
        companionAuthKey: ""
  # Fleet entries have this shape:
  # - companionId: 11111111-1111-4111-8111-111111111111
  #   postgresSchema: companion_a
  #   companionDataClaim: companion-a-data
  #   workspaceClaim: companion-a-workspace
  #   authSecret:
  #     name: companion-a-auth
  #     sessionIntegrityKey: session-integrity-token
  #     companionAuthKey: companion-auth-token
  #
  # Entry order is authoritative: the FIRST entry is the primary/canonical
  # companion. The shared gateway and fleet Garden processes assume its
  # identity (runtime.companionId, runtime.companionDataDir,
  # runtime.workspacePath, and the persistence.* existingClaims must all name
  # the first entry; rendering fails closed otherwise), and it is the fleet
  # backup leader (isFleetBackupLeader). Every later entry is a follower with
  # its own agent Deployment, admin Service, certificates, and PVC claims.
  #
  # Paths and network identities are deliberately not configurable per entry.
  # They are derived exactly as the runtime does:
  #   companion data: <runtimeRoot>/companions/<companionId>
  #   character card: <companion data>/companion.json
  #   workspace:      <runtimeRoot>/workspaces/personal/<companionId>
  #   admin Service:  <release>-agent-admin-<companionId>
  #   SPIFFE:         /psfn/agent/<companionId>

bootstrap:
  # First-ever-install opt-in ONLY. When true, the seed init container copies
  # missing cluster-global owners from /app/config/*.seed.json into system-data
  # and missing per-companion owners (capability-tier.json, scheduler.json,
  # charge-policy.json, skills.json) into this release's companion-data root.
  # Leave false so absent owner files fail closed at startup with the runtime's
  # loadRequiredJson error instead of silently running on seed defaults. See
  # src/system/config/load-or-seed.ts: "Runtime config must not seed itself".
  # Existing releases are upgraded independently of this flag: the init
  # container moves legacy system-data scheduler/capability values into their
  # companion-owned paths using a hash-bound, fail-closed migration. Existing
  # system-data charge-policy/skills owners require the explicit, approval-bound
  # system-owner fleet migration; this Helm compatibility path does not move them.
  seedOwnerFiles: false

# Explicit, one-rollout compatibility boundary for legacy fleets whose
# charge-policy.json and skills.json still live under system-data. This is
# disabled after the approval-bound fan-out succeeds. `required` lets a
# deployment pipeline fail rendering instead of accidentally omitting the
# migration hook for a rollout that is known to need it.
ownerMigration:
  required: false
  enabled: false
  # Topology is derived from companions.json presence, not a flag: the migrator
  # loads a pre-provisioned manifest when present and otherwise synthesizes the
  # one-entry migration fleet from the environment (COMPANION_ID + roots). List
  # every manifest entry under `companions` below (one entry for a fleet of one).
  runtimeRoot: /runtime
  systemDataDir: /runtime/system-data
  systemDataClaim: ""
  backupsDir: /backups
  backupsClaim: ""
  # Optional existingClaim subPath, such as `backups` on the runtime PVC.
  backupsSubPath: ""
  snapshotOutputDir: /backups/pre-owner-migration
  activeDeadlineSeconds: 300
  approvals: {}
  # Single topology: the one explicit companion. Multi topology: every entry
  # in companions.json. Claims and runtime-root-relative paths must be exact.
  companions: []
  verification:
    # Mandatory whenever the migration hook is enabled.
    enabled: true
    initialChargeQuota: 1
    initialMaxLoadedSkills: 1
    timeoutSeconds: 60

ports:
  gatewayApi: 10053
  gatewayRpc: 10054
  garden: 10054
  agentAdmin: 10055
  satelliteHub: 8787
  satelliteHubControl: 8788
  companionUiTest: 8080
  postgres: 5432
  redis: 6379
  liteLlm: 4000
  emosimHttp: 17342
  emosimTcp: 17341

hostPorts:
  gatewayApi:
    enabled: false
    port: 10053
    hostIP: ""
    sourceCIDRs: []
  # Optional direct Garden access for non-SSO deployments. ADMIN_TOKEN remains
  # mandatory. Prefer a loopback hostIP or restrict sourceCIDRs when possible.
  garden:
    enabled: false
    port: 10054
    hostIP: ""
    sourceCIDRs: []
  # LAN satellite devices/browsers reach the hub websocket as ws://<node>:8787.
  # This follows the same single-node exposure mechanism as the gateway API
  # hostPort (Traefik ingress stays available for name-based HTTP, but LAN
  # devices speak raw ws:// to the node IP). Set sourceCIDRs to the trusted
  # satellite subnet when networkPolicy.enabled=true.
  satelliteHub:
    enabled: false
    port: 8787
    hostIP: ""
    sourceCIDRs: []

workloads:
  gateway:
    replicaCount: 1
    image:
      repository: ""
      tag: ""
      digest: ""
    command: ["node", "dist/gateway-main.js"]
    resources: {}
    writableMounts:
      - /app/system-data
      - /app/logs
      - /app/tmp
      - /app/workspace
      - /run/psfn
  agent:
    replicaCount: 1
    image:
      repository: ""
      tag: ""
      digest: ""
    command: ["node", "dist/agent-main.js"]
    resources: {}
    writableMounts:
      - /app/system-data
      - /app/companion-data
      - /app/workspace
      - /app/logs
      - /app/tmp
      - /app/backups
      - /run/psfn
  garden:
    replicaCount: 1
    image:
      repository: ""
      tag: ""
      digest: ""
    command: ["node", "dist/operator-main.js"]
    resources: {}
    writableMounts:
      - /app/system-data
      - /app/tmp

identity:
  seedStarterCard: true
  starterCard:
    spec: chara_card_v2
    spec_version: "2.0"
    data:
      name: Companion
      description: Companion is a newly bootstrapped PSFN companion awaiting onboarding and identity tuning.
      personality: Warm, attentive, honest about uncertainty, and ready to be personalized through onboarding.
      scenario: The operator is bringing this companion online in a fresh Kubernetes environment.
      first_mes: "Hi, I'm Companion."
      mes_example: ""
      system_prompt: ""
      post_history_instructions: ""
      tags:
        - bootstrap
      creator: system
      creator_notes: Auto-seeded starter identity for first-run bootstrap.

persistence:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  systemData:
    size: 2Gi
    existingClaim: ""
  companionData:
    size: 10Gi
    existingClaim: ""
  workspace:
    size: 10Gi
    existingClaim: ""
  runtime:
    size: 10Gi
    existingClaim: ""
  modelCache:
    enabled: true
    size: 8Gi
    existingClaim: ""

repositoryCheckout:
  enabled: false
  mountPath: /app/repository
  readOnly: false
  hostPath:
    path: ""
    type: Directory
  persistentVolumeClaim:
    claimName: ""

beads:
  # null preserves the runtime's current fallback behavior: beads tools are
  # enabled only when the startup code discovers .beads in its existing roots.
  toolsEnabled: null
  allowActions: []

secrets:
  create: true
  existingSecret: ""
  # Keep true for helm lint/template with placeholder or externally supplied
  # secrets. Set false in install values to fail rendering when required keys
  # are missing.
  allowMissingRequired: true
  values:
    apiKey: CHANGE_ME_API_KEY
    adminToken: CHANGE_ME_ADMIN_TOKEN
    gatewaySessionHmacKey: CHANGE_ME_GATEWAY_SESSION_HMAC_KEY
    # Role-bound worker proof derived from gatewaySessionHmacKey for
    # COMPANION_ID. Production operators may supply it through an existing
    # Secret instead of persisting it in Helm values.
    gatewaySessionIntegrityAuthToken: ""
    # Distinct role-bound agent proof derived from gatewaySessionHmacKey for
    # COMPANION_ID. Required by every agent, including a fleet of one.
    gatewayCompanionAuthToken: ""
    # Dedicated satellite-hub bearer credential (Sprint-10 H4: never reuse the
    # shared API_KEY for satellites). Injected into the hub as PSFN_API_KEY and
    # into the gateway inside API_SATELLITE_KEYS, so the hub authenticates as a
    # DISTINCT satellite-scoped principal (api-key-<sha256(key)[:24]>) that the
    # matching satellites.json endpoint must list in auth.apiKeyPrincipalIds.
    # Required when satelliteHub.enabled=true (>=16 chars).
    satelliteHubApiKey: ""
    homeAssistantToken: ""
    satelliteHubControlToken: ""
    # Optional comma-separated additional per-satellite bearer keys appended to
    # the gateway's API_SATELLITE_KEYS list (for LAN satellites that are not
    # the hub). Each key must be >=16 chars and distinct.
    extraSatelliteApiKeys: ""
    openRouterApiKey: ""
    openAiApiKey: ""
    liteLlmApiKey: CHANGE_ME_LITELLM_API_KEY
    backupEncryptionKey: CHANGE_ME_BACKUP_ENCRYPTION_KEY
    embeddingApiKey: ""
    hfToken: ""
    discordToken: ""
    discordBotId: ""
    deepgramApiKey: ""
    elevenLabsApiKey: ""
    falApiKey: ""
    ntfyToken: ""
  keys:
    apiKey: API_KEY
    testingHarnessApiKey: TESTING_HARNESS_API_KEY
    adminToken: ADMIN_TOKEN
    gatewaySessionHmacKey: GATEWAY_SESSION_HMAC_KEY
    gatewaySessionIntegrityAuthToken: GATEWAY_SESSION_INTEGRITY_AUTH_TOKEN
    gatewayCompanionAuthToken: GATEWAY_COMPANION_AUTH_TOKEN
    satelliteHubApiKey: SATELLITE_HUB_API_KEY
    homeAssistantToken: HOME_ASSISTANT_TOKEN
    satelliteHubControlToken: SATELLITE_HUB_CONTROL_TOKEN
    satelliteApiKeys: API_SATELLITE_KEYS
    openRouterApiKey: OPENROUTER_API_KEY
    openAiApiKey: OPENAI_API_KEY
    liteLlmApiKey: LITELLM_API_KEY
    backupEncryptionKey: PSFN_BACKUP_ENCRYPTION_KEY
    embeddingApiKey: EMBEDDING_API_KEY
    hfToken: HF_TOKEN
    discordToken: DISCORD_TOKEN
    discordBotId: DISCORD_BOT_ID
    deepgramApiKey: DEEPGRAM_API_KEY
    elevenLabsApiKey: ELEVENLABS_API_KEY
    falApiKey: FAL_API_KEY
    ntfyToken: NTFY_TOKEN

postgres:
  # The database URL credential is shared by the gateway, companion agents,
  # and the fleet Garden's approved request-scoped direct database services.
  enabled: true
  image:
    repository: docker.io/pgvector/pgvector
    tag: 0.8.1-pg17
    digest: sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    pullPolicy: IfNotPresent
  auth:
    database: psfn
    username: psfn
    password: CHANGE_ME_POSTGRES_PASSWORD
    existingSecret: ""
    keys:
      password: postgres-password
      databaseUrl: postgres-database-url
  primary:
    resources: {}
    persistence:
      size: 20Gi
  external:
    enabled: false
    databaseUrlSecret:
      name: ""
      key: postgres-database-url

redis:
  enabled: true
  mode: internal
  image:
    repository: docker.io/library/redis
    tag: 8.4.0-bookworm
    digest: sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
    pullPolicy: IfNotPresent
  auth:
    password: CHANGE_ME_REDIS_PASSWORD
    existingSecret: ""
    key: redis-password
  persistence:
    size: 5Gi
  resources: {}
  external:
    url: ""
    passwordSecret:
      name: ""
      key: redis-password
    tls:
      enabled: false
      rejectUnauthorized: true
      caSecret:
        name: ""
        key: ca.crt

emosim:
  # Long-lived emo_sim emotion-simulation engine consumed by the observer
  # eval sidecar (observerEvalSidecar.adapter.kind=emosim_server pointed at
  # http://<release>-emosim:17342). The emo_sim API is UNAUTHENTICATED by
  # upstream design: it is exposed ONLY as a ClusterIP service and guarded by
  # NetworkPolicy (agent pods only). Never expose these ports externally.
  enabled: false
  image:
    # Built from docker/Dockerfile.emosim with an emo_sim checkout as the
    # build context; see the Dockerfile header for the exact build command.
    repository: localhost/psfn-emosim
    tag: 0.1.0
    digest: ""
    pullPolicy: IfNotPresent
  # Extra server flags appended after the fixed entrypoint
  # (python server.py --host=0.0.0.0 --statedir=/state), e.g.
  # ["--timescale=120", "--drivescale=1", "--tick=2"].
  extraArgs: []
  persistence:
    # Session snapshots + events.jsonl live here; survives restarts and
    # provides the wall-clock downtime catch-up on recovery.
    size: 1Gi
  resources: {}

liteLlm:
  enabled: true
  mode: internal
  replicaCount: 1
  image:
    repository: ghcr.io/berriai/litellm
    tag: v1.74.9-stable
    digest: sha256:f78c763d6f2289305a3acc3a003c6170f797bdda70c56e75776fbab670e663cc
    pullPolicy: IfNotPresent
  command: ["litellm"]
  resources: {}
  config:
    existingConfigMap: ""
    key: config.yaml
    path: /etc/litellm/config.yaml
    yaml: |-
      # The wildcard route alone does NOT serve PSFN: the runtime requests
      # unprefixed model names (e.g. "z-ai/glm-5.2"), which fail the
      # "openrouter/*" group and silently fall back to direct OpenRouter.
      # Every model referenced by a models.json slot needs an explicit
      # unprefixed route here (2026-07-06 incident, bead psfn-framework-oylk).
      model_list:
        - model_name: "openrouter/*"
          litellm_params:
            model: "openrouter/*"
            api_key: "os.environ/OPENROUTER_API_KEY"
        - model_name: "z-ai/glm-5.2"
          litellm_params:
            # Route via OpenRouter ':exacto' variant, which orders upstream
            # providers by measured tool-call reliability. Flaky vLLM-family
            # upstreams intermittently return literal '{}' tool-call arguments;
            # z-ai/glm-5.2:exacto evaluated 10/10 clean (bead psfn-framework-mihm).
            # Keep model_name unprefixed so models.json/settings are unchanged.
            model: "openrouter/z-ai/glm-5.2:exacto"
            api_key: "os.environ/OPENROUTER_API_KEY"
        - model_name: "z-ai-glm-5.2-nitro"
          litellm_params:
            # LiteLLM treats the colon variant in a requested model name as a
            # model-group separator. Keep the public alias colon-free while
            # preserving OpenRouter's throughput-prioritized Nitro variant in
            # the upstream model ID (bead psfn-framework-z82t).
            model: "openrouter/z-ai/glm-5.2:nitro"
            reasoning_effort: "none"
            api_key: "os.environ/OPENROUTER_API_KEY"
        - model_name: "moonshotai/kimi-k2.6"
          litellm_params:
            model: "openrouter/moonshotai/kimi-k2.6"
            api_key: "os.environ/OPENROUTER_API_KEY"
        - model_name: "deepseek/deepseek-v4-pro"
          litellm_params:
            model: "openrouter/deepseek/deepseek-v4-pro"
            api_key: "os.environ/OPENROUTER_API_KEY"
        - model_name: "google/gemini-3.1-flash-lite"
          litellm_params:
            model: "openrouter/google/gemini-3.1-flash-lite"
            api_key: "os.environ/OPENROUTER_API_KEY"
        - model_name: "openai/gpt-5.4-mini"
          litellm_params:
            model: "openrouter/openai/gpt-5.4-mini"
            api_key: "os.environ/OPENROUTER_API_KEY"
      litellm_settings:
        drop_params: true
      general_settings:
        master_key: "os.environ/LITELLM_MASTER_KEY"
  external:
    baseUrl: ""
  extraEnv: []
  extraEnvFrom: []

embeddings:
  provider: transformers
  transformers:
    model: Xenova/all-MiniLM-L6-v2
    dims: 384
    cacheDir: /app/models/transformers
    prefetch:
      enabled: false
  api:
    url: ""
    model: snowflake-arctic-embed2
    dims: 1024
    apiKeySecret:
      name: ""
      key: EMBEDDING_API_KEY

modelPrefetch:
  enabled: false
  image:
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: ""
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  resources: {}
  textEmotion:
    enabled: true
    model: SamLowe/roberta-base-go_emotions-onnx
    dtype: fp32

certificates:
  enabled: true
  issuer:
    create: true
    kind: Issuer
    name: ""
    existingIssuerRef:
      name: ""
      kind: Issuer
      group: cert-manager.io
  trustDomain: cluster.local
  duration: 2160h
  renewBefore: 360h
  mountBasePath: /run/psfn/tls

# Fleet authentication is part of the one Kubernetes topology. The canonical
# fleet-auth.json owner file remains authoritative for OAuth/session policy;
# this value enables the matching process/deployment wiring.
fleetAuth:
  enabled: true
  # Optional exact server-owned binding for /companion-ui/. It may be omitted
  # only when the canonical companion fleet contains exactly one companion.
  companionUiCompanionId: ""
  # Gateway credential env for the fleet-auth.json credential references.
  # The owner file names every Fleet Auth credential as
  # { kind: env, envName: FLEET_AUTH_* } (provider.clientSecretRef and each
  # credentials.*Ref); the gateway fails closed at startup when a referenced
  # env var is unset. List every env-kind reference here so the chart owns
  # the wiring (never kubectl set env). Each entry supplies an uppercase env
  # name plus exactly one of a Secret reference (secretRef.name +
  # secretRef.key) or a plain non-secret value (e.g. a filesystem root).
  # References resolved from the credential vault instead of env need no
  # entry.
  credentialEnv: []
  # - name: FLEET_AUTH_SESSION_PEPPER
  #   secretRef:
  #     name: psfn-fleet-auth
  #     key: session-pepper
  # - name: FLEET_AUTH_AUTHORITY_FLOOR_ROOT
  #   value: /runtime/system-data/fleet-auth/authority-floor

networkPolicy:
  enabled: true
  ingressController:
    namespaceSelector:
      kubernetes.io/metadata.name: kube-system
    podSelector:
      app.kubernetes.io/name: traefik
  dns:
    namespaceSelector:
      kubernetes.io/metadata.name: kube-system
    podSelector:
      k8s-app: kube-dns
  gateway:
    allowExternalEgress: true
  agent:
    allowExternalEgress: false
  modelPrefetch:
    allowExternalHttpsEgress: true
  satelliteHub:
    allowExternalEgress: true
  liteLlm:
    allowExternalEgress: true

ingress:
  enabled: true
  className: traefik
  annotations: {}
  gateway:
    enabled: true
    host: psfn-gateway.local
    path: /
    pathType: Prefix
    tls:
      enabled: true
      # Existing public/browser-trusted TLS Secret for the exact gateway host.
      secretName: psfn-public-origin-tls
  # Garden is reached only through the authenticated fleet portal on the
  # gateway origin. This legacy field remains disabled in the fleet shape.
  garden:
    enabled: false
    host: psfn-garden.local
    path: /
    pathType: Prefix
  satelliteHub:
    enabled: false
    host: psfn-hub.local
    path: /
    pathType: Prefix

satelliteHub:
  enabled: false
  image:
    # Build from the external PSFN-Satellite-Hub source with
    # docker/satellite-hub/Dockerfile, then set repository plus a pinned tag
    # or digest. Floating tags such as latest/main are rejected when enabled.
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  command: ["node", "dist/ts/hub/main.js"]
  agentRuntime: psfn
  psfnModel: psfn
  # Registry-aligned satellite identity injected as PSFN_SATELLITE_ID /
  # PSFN_ENDPOINT_ID / PSFN_CLAIM_TYPE. All three are required when the hub is
  # enabled (fail closed: the hub must never fall back to its built-in default
  # satellite identity) and must match the satellites.json endpoint entry that
  # lists the hub's satellite-scoped principal.
  identity:
    satelliteId: ""
    endpointId: ""
    claimType: ""
  # Optional PSFN_CAPABILITY_PROFILE override (e.g. text-only, voice-only).
  # Empty keeps the hub default profile; the claim type above still governs
  # which registry claim binding is used.
  capabilityProfile: ""
  # HUB_TEXT_ONLY=true runs the hub without Deepgram/ElevenLabs: voice secrets
  # and elevenLabsVoiceId become optional. false (voice mode) requires
  # deepgramApiKey, elevenLabsApiKey, and elevenLabsVoiceId.
  textOnly: false
  # Companion event relay bridge (approvals/artifacts/tool_activity). Points
  # PSFN_COMPANION_BASE_URL at the in-cluster gateway /v1 edge; the API key
  # falls back to the hub's PSFN_API_KEY (the dedicated satelliteHubApiKey).
  # Requires the satellites.json endpoint to grant the approvals, artifacts,
  # and tool_activity telemetry scopes.
  companionBridge:
    enabled: true
  homeAssistant:
    enabled: false
    baseUrl: ""
    # NetworkPolicy is deny-by-default for private LANs. When HA is enabled,
    # name every trusted HA host/subnet explicitly and pin its websocket/API
    # port. Example: ["192.0.2.20/32"] and 8123.
    egressCIDRs: []
    egressPort: 8123
    # Server-owned device identities. credentialSha256 is a digest, never the
    # plaintext HUB_DEVICE_TOKEN used by the satellite. Each device may list
    # exact homeAssistantEntityIds; the Hub rejects reads and service calls
    # outside that authenticated device's list.
    devices: []
  # A cert-manager client Certificate (chain: chart CA / existing psfn-ca
  # Issuer) is issued for the hub whenever it is enabled and mounted at
  # <certificates.mountBasePath>/psfn-client. Runtime auth currently uses the
  # scoped bearer key; the mounted, auto-renewing certificate stages the mTLS
  # upgrade path documented in docs/satellite-hub-kube.md.
  elevenLabsVoiceId: ""
  artifactRoot: /app/.artifacts/runtime-ts
  resources: {}

companionUiTest:
  # Optional in-cluster static web surface that serves the companion-ui PWA so
  # the operator can reach it from a browser and chat through the Satellite Hub.
  # It serves pre-built static files only (no server logic) and makes no
  # outbound calls. The browser uses only canonical same-origin fleet and Hub
  # routes; the Hub authenticates its backchannel and mints fresh device
  # assertions server-side. This is a stopgap test surface, to be replaced by
  # a packaged app.
  enabled: false
  # Guest use is disabled unless the operator explicitly exposes the enrolled
  # room/device without a fleet human attachment.
  guestMode: disabled
  # This service is always internal. With fleet authentication enabled, the
  # gateway exposes the signed-out shell at /companion-ui/ on the canonical
  # HTTPS origin; session status, login, and realtime authority remain
  # same-origin. Direct ingress and NodePort exposure are forbidden.
  service:
    type: ClusterIP
  image:
    # Build with docker/companion-ui/build-image.sh, then set repository plus a
    # pinned tag or digest. Floating tags such as latest/main are rejected when
    # enabled.
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  resources: {}

