# Static-file nginx config for the companion-ui test PWA surface.
#
# No server logic: this only serves the pre-built Vite dist/ tree. The config is
# written to run under an arbitrary non-root uid (the chart pins uid/gid 999):
# the pid file and all temp paths live under the world-writable /tmp, and logs
# go to stdout/stderr so nothing needs a writable /var.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Writable temp paths so an arbitrary non-root uid never touches /var.
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The service worker must never be cached, or clients pin a stale shell.
    location = /sw.js {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      try_files $uri =404;
    }

    # PWA manifest needs the correct content type; default mime.types may omit it.
    location = /manifest.webmanifest {
      types { }
      default_type application/manifest+json;
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    # Hashed build assets are safe to cache aggressively.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # SPA fallback: unknown routes resolve to the app shell.
    location / {
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
