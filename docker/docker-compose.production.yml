services:
  # Dedicated production runtime container profile with isolated mutable mounts.
  # Do not point any of these directories at continuous/dev roots.
  psfn-agent-production:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    container_name: psfn-agent-production
    network_mode: "none"
    restart: unless-stopped
    volumes:
      # Gateway socket (created by host gateway process)
      - ${PSFN_GATEWAY_SOCKET_DIR:-/run/psfn}:/run/psfn
      # Production-isolated mutable roots
      - ${PSFN_PRODUCTION_SYSTEM_DATA_DIR:-../runtime/production/system-data}:/app/system-data
      - ${PSFN_PRODUCTION_COMPANION_DATA_DIR:-../runtime/production/companion-data}:/app/companion-data
      - ${PSFN_PRODUCTION_WORKSPACE_DIR:-../runtime/production/workspace}:/app/workspace
      - ${PSFN_PRODUCTION_LOGS_DIR:-../runtime/production/logs}:/app/logs
      - ${PSFN_PRODUCTION_TEMP_DIR:-../runtime/production/tmp}:/app/tmp
      - ${PSFN_PRODUCTION_BACKUPS_DIR:-../runtime/production/backups}:/app/backups
      # Character card + identity (RO)
      - ${CHARACTER_CARD_DIR:-/home/user/.openclaw/agents/main}:/app/identity:ro
    environment:
      GATEWAY_SOCKET: /run/psfn/gateway.sock
      PSFN_RUNTIME_LAYOUT_MODE: production
      PSFN_RUNTIME_ROOT: /app/runtime-root
      SYSTEM_DATA_DIR: /app/system-data
      COMPANION_DATA_DIR: /app/companion-data
      DATA_DIR: /app/system-data
      WORKSPACE_PATH: /app/workspace
      PSFN_LOGS_DIR: /app/logs
      PSFN_TEMP_DIR: /app/tmp
      BACKUP_ROOT_DIR: /app/backups
      DATABASE_PATH: /app/companion-data/purrsephone.db
      CHARACTER_CARD_PATH: /app/identity/character.json
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-1024}
