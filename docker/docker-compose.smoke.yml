name: psfn-smoke

# ── Compose smoke stack (psfn-framework-65rk.12) ──
# The contributor onboarding / "someone can run it" path (public-flip checklist
# item 4). This file stands up the real split runtime end to end:
#
#   postgres  pgvector-backed Postgres 17 — the only supported runtime store.
#   seed      one-shot: lays split-root owner files + a starter card, chowns the
#             shared volumes to the runtime UID (runs before gateway/agent).
#   gateway   host-side process. Holds ALL secrets (provider key, session HMAC,
#             backup key) and owns external egress + the OpenAI-compatible /v1
#             edge. Talks to Postgres and to the agent over the shared gateway
#             socket.
#   agent     isolated companion process. No dotenv, no provider/egress secrets;
#             reaches the gateway over the shared Unix socket and drives turns.
#   satellite-hub
#             the PSFN Satellite Hub in text-only mode. Authenticates to the
#             gateway as a DEDICATED satellite-scoped principal (never the
#             operator API_KEY), which the seed binds to an endpoint in
#             satellites.json. Published on 127.0.0.1:18787.
#   companion-ui
#             the companion-ui PWA served as static files by nginx. No server
#             logic and no outbound calls. Published on 127.0.0.1:18080.
#
# Split topology is real here: gateway and agent are separate containers that
# share ONLY the gateway socket (an internal named volume). system-data and
# companion-data are DISTINCT named volumes, so the two roots can never overlap
# (production layout rejects overlap). Helm remains the reference deployment
# shape (network-mode mTLS RPC + cert-manager); this compose uses the simpler
# single-node Unix-socket RPC and is explicitly not production-hardened.
#
# One documented secret slot: export OPENROUTER_API_KEY before `up` for a full
# provider-backed turn. Without it the whole stack still comes up healthy, the
# gateway<->agent RPC connects, migrations apply, and /v1/chat/completions is
# accepted — the turn fails ONLY at the provider egress boundary.
#
# Bring up the whole stack, verify the hub and companion-ui surfaces, and drive
# one chat turn with:  npm run smoke:docker
# Or manually:  docker compose -f docker/docker-compose.smoke.yml up -d --wait

x-runtime-image: &runtime-image
  build:
    context: ..
    dockerfile: docker/Dockerfile.agent
  image: psfn-framework:smoke

# Non-secret runtime layout + identity shared by gateway and agent. Production
# split-root layout: SYSTEM_DATA_DIR and COMPANION_DATA_DIR are separate volumes.
# Every path below sits under PSFN_RUNTIME_ROOT because companions.json is
# resolved against that root and the runtime binds each process to exactly one
# fleet entry: a companion root outside the root, or one that disagrees with the
# manifest, fails startup with a multi-companion identity mismatch. The derived
# layout is companions/<slug> for companion data and workspaces/personal/<id>
# for the Personal Workspace, so the volumes mount exactly there.
x-runtime-env: &runtime-env
  PSFN_RUNTIME_MODE: split
  PSFN_RUNTIME_LAYOUT_MODE: production
  PSFN_RUNTIME_ROOT: /app/runtime-root
  SYSTEM_DATA_DIR: /app/runtime-root/system-data
  COMPANION_DATA_DIR: /app/runtime-root/companions/smoke
  WORKSPACE_PATH: /app/runtime-root/workspaces/personal/${PSFN_SMOKE_COMPANION_ID:-11111111-1111-4111-8111-111111111111}
  PSFN_LOGS_DIR: /app/logs
  PSFN_TEMP_DIR: /app/tmp
  BACKUP_ROOT_DIR: /app/backups
  GATEWAY_SOCKET: /run/psfn/gateway.sock
  CHARACTER_CARD_PATH: /app/runtime-root/companions/smoke/companion.json
  # Must equal the fleet entry's postgresSchema; the runtime binds one process
  # to one fleet entry and refuses an unset or disagreeing schema.
  COMPANION_PG_SCHEMA: companion_smoke
  COMPANION_ID: ${PSFN_SMOKE_COMPANION_ID:-11111111-1111-4111-8111-111111111111}

# Single-node runtime store. This is the persistence-tier credential, not a
# provider/egress secret. It is deliberately NOT part of x-runtime-env: the
# gateway and the seed take it inline, but the agent process refuses an inline
# POSTGRES_DATABASE_URL (runtime credential custody requires a file or fd), so
# the seed writes it to the agent-auth volume and the agent reads it via
# POSTGRES_DATABASE_URL_FILE — the same file-delivery shape k8s uses.
x-postgres-url: &postgres-url postgresql://psfn:psfn@postgres:5432/psfn

# Dedicated satellite-scoped bearer for the Satellite Hub. It is DISTINCT from
# API_KEY/ADMIN_TOKEN by contract (the gateway refuses a satellite key that
# reuses either) and >=16 characters. The seed derives the matching
# api-key-<sha256[:24]> principal into satellites.json; the gateway lists the
# key in API_SATELLITE_KEYS and the hub presents it as PSFN_API_KEY.
x-satellite-key: &satellite-key ${PSFN_SMOKE_SATELLITE_API_KEY:-psfn-smoke-satellite-key-please-rotate}
x-satellite-id: &satellite-id smoke-hub
x-satellite-endpoint-id: &satellite-endpoint-id smoke-hub-endpoint
x-satellite-claim-type: &satellite-claim-type satellite.endpoint

services:
  postgres:
    image: ${PSFN_SMOKE_POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    container_name: psfn-smoke-postgres
    environment:
      POSTGRES_DB: psfn
      POSTGRES_USER: psfn
      POSTGRES_PASSWORD: psfn
      PGDATA: /var/lib/postgresql/data/pgdata
    networks:
      - psfn-smoke-internal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psfn -d psfn"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  seed:
    <<: *runtime-image
    container_name: psfn-smoke-seed
    user: "0:0"
    entrypoint: ["sh", "/app/scripts/ops/psfn-compose-smoke-seed.sh"]
    environment:
      <<: *runtime-env
      PSFN_SMOKE_COMPANION_NAME: ${PSFN_SMOKE_COMPANION_NAME:-Smoke}
      # Satellite registry inputs. The seed writes satellites.json binding the
      # derived principal of this key to this endpoint; without it the gateway
      # answers the hub with satellite_claim_not_registered.
      PSFN_SMOKE_SATELLITE_API_KEY: *satellite-key
      PSFN_SMOKE_SATELLITE_ID: *satellite-id
      PSFN_SMOKE_SATELLITE_ENDPOINT_ID: *satellite-endpoint-id
      PSFN_SMOKE_SATELLITE_CLAIM_TYPE: *satellite-claim-type
      # Sourced so the seed can write the agent's file-delivered copy.
      POSTGRES_DATABASE_URL: *postgres-url
      # The seed is the trusted credential-bootstrap step: it holds the session
      # HMAC key only to DERIVE the agent's two role-bound proofs, then hands the
      # agent just those proofs (never the raw key) via the agent-auth volume. It
      # also relays the agent's persistence-tier backup key into that same
      # sourced file (mandatory encrypted backups), so the agent service declares
      # no secrets of its own.
      GATEWAY_SESSION_HMAC_KEY: ${PSFN_SMOKE_SESSION_HMAC_KEY:-psfn-smoke-session-hmac-key}
      PSFN_BACKUP_ENCRYPTION_KEY: ${PSFN_SMOKE_BACKUP_KEY:-psfn-smoke-backup-encryption-key-please-rotate}
    networks:
      - psfn-smoke-internal
    volumes:
      - ../scripts/ops:/app/scripts/ops:ro
      - system-data:/app/runtime-root/system-data
      - companion-data:/app/runtime-root/companions/smoke
      - workspace:/app/runtime-root/workspaces/personal/${PSFN_SMOKE_COMPANION_ID:-11111111-1111-4111-8111-111111111111}
      - gateway-sock:/run/psfn
      - agent-auth:/run/psfn-auth
      - model-cache:/app/models
    restart: "no"

  # Downloads the in-process ML models (text-emotion + embedding) into the shared
  # model cache while it still has egress, so the isolated agent can warm them
  # offline. Compose analogue of the Helm model-prefetch Job.
  model-prefetch:
    <<: *runtime-image
    container_name: psfn-smoke-model-prefetch
    depends_on:
      seed:
        condition: service_completed_successfully
    entrypoint: ["node", "/app/scripts/ops/psfn-compose-smoke-prefetch.mjs"]
    environment:
      # /cache-input is a deterministic, operator-supplied Hugging Face cache.
      # Offline mode rejects an empty input before attempting model loading.
      PSFN_SMOKE_MODEL_CACHE_INPUT_DIR: /cache-input
      PSFN_SMOKE_MODEL_PREFETCH_OFFLINE: ${PSFN_SMOKE_MODEL_PREFETCH_OFFLINE:-0}
      PSFN_SMOKE_TEXT_EMOTION_MODEL_REVISION: ${PSFN_SMOKE_TEXT_EMOTION_MODEL_REVISION:-90ee0c1c4796d370e68968687b8ba51fc11224f4}
      PSFN_SMOKE_EMBEDDING_MODEL_REVISION: ${PSFN_SMOKE_EMBEDDING_MODEL_REVISION:-751bff37182d3f1213fa05d7196b954e230abad9}
      PSFN_SMOKE_INJECTION_MODEL_DIR: /app/models/prompt-injection-v2
      PSFN_SMOKE_INJECTION_PROVISION_SCRIPT: /app/dist/provision-injection-model.js
    networks:
      - psfn-smoke-egress
    volumes:
      - ../scripts/ops:/app/scripts/ops:ro
      - model-cache:/app/models
      - type: bind
        source: ${PSFN_SMOKE_MODEL_CACHE_SOURCE:-../models/transformers}
        target: /cache-input
        read_only: true
    restart: "no"

  # Self-contained readiness sink for the disposable Compose profile. It has no
  # host port, no external network, no credentials, and stores/logs no payload.
  operator-alert-sink:
    <<: *runtime-image
    container_name: psfn-smoke-operator-alert-sink
    entrypoint: ["node", "/app/scripts/ops/psfn-compose-smoke-operator-alert-sink.mjs"]
    environment:
      PSFN_SMOKE_OPERATOR_ALERT_HOST: 0.0.0.0
      PSFN_SMOKE_OPERATOR_ALERT_PORT: "3000"
      PSFN_SMOKE_OPERATOR_ALERT_TOPIC: smoke-operator-alerts
    networks:
      - psfn-smoke-internal
    volumes:
      - ../scripts/ops:/app/scripts/ops:ro
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "--input-type=module"
        - "--eval"
        - "const response = await fetch('http://127.0.0.1:3000/health'); if (!response.ok) process.exit(1)"
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  gateway:
    <<: *runtime-image
    container_name: psfn-smoke-gateway
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      model-prefetch:
        condition: service_completed_successfully
      operator-alert-sink:
        condition: service_healthy
    command: ["node", "dist/gateway-main.js"]
    environment:
      <<: *runtime-env
      POSTGRES_DATABASE_URL: *postgres-url
      # companions.json names these credential references; the gateway owns the
      # shared-schema migration and this single-node stack points both at the
      # one smoke database.
      SHARED_SCHEMA_MIGRATION_DATABASE_URL: *postgres-url
      COMPANION_SMOKE_DATABASE_URL: *postgres-url
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      ADMIN_HOST: 127.0.0.1
      ADMIN_PORT: "3001"
      # Secure local API: the port is published on 0.0.0.0, so a bearer is
      # required (the insecure bypass only permits loopback binds). The smoke
      # harness sends this key; the ONLY remaining failure surface is provider
      # egress.
      API_KEY: ${PSFN_SMOKE_API_KEY:-psfn-smoke-api-key-please-rotate}
      # Per-satellite bearer credentials. Satellite principals are restricted to
      # the satellite surfaces (/v1/chat/completions, /v1/telemetry/ingest,
      # /v1/satellites/config, /v1/companion/*) and are further gated by
      # satellites.json.
      API_SATELLITE_KEYS: *satellite-key
      # Secrets live here (host-side gateway). Dev-only fixed values; the
      # provider key is the single real slot a runnable turn needs.
      GATEWAY_SESSION_HMAC_KEY: ${PSFN_SMOKE_SESSION_HMAC_KEY:-psfn-smoke-session-hmac-key}
      PSFN_BACKUP_ENCRYPTION_KEY: ${PSFN_SMOKE_BACKUP_KEY:-psfn-smoke-backup-encryption-key-please-rotate}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # CogSec refuses to start without a configured operator-alert route. The
      # disposable internal sink acknowledges and discards smoke alerts.
      NTFY_BASE_URL: http://operator-alert-sink:3000
      NTFY_TOPIC: smoke-operator-alerts
    ports:
      - "127.0.0.1:${PSFN_SMOKE_API_PORT:-13000}:3000"
    # The gateway is the ONLY service with external egress (provider calls). The
    # agent stays on the internal-only network and fails closed if it can reach
    # the internet, mirroring the k8s NetworkPolicy that denies agent egress.
    networks:
      - psfn-smoke-internal
      - psfn-smoke-egress
    volumes:
      - system-data:/app/runtime-root/system-data
      - companion-data:/app/runtime-root/companions/smoke
      - workspace:/app/runtime-root/workspaces/personal/${PSFN_SMOKE_COMPANION_ID:-11111111-1111-4111-8111-111111111111}
      - gateway-sock:/run/psfn
      - model-cache:/app/models
    healthcheck:
      # The API edge listening proves the gateway booted (migrations applied,
      # config validated). Deeper agent-connectivity is asserted by smoke:docker.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('node:net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  agent:
    <<: *runtime-image
    container_name: psfn-smoke-agent
    depends_on:
      gateway:
        condition: service_healthy
      model-prefetch:
        condition: service_completed_successfully
    # Source the two derived HMAC proofs (written by the seed step; the raw
    # session HMAC key is never present here) and exec the agent.
    command:
      - "sh"
      - "-c"
      - ". /run/psfn-auth/agent-auth.env && exec node dist/agent-main.js"
    # No dotenv (agent-main never loads it) and no provider/egress secrets: the
    # environment carries only non-secret layout/identity, a PATH to the
    # persistence credential (never the credential itself), and the two sourced
    # HMAC proofs. All external calls route through the gateway over the socket.
    environment:
      <<: *runtime-env
      # Path only. An inline POSTGRES_DATABASE_URL here is rejected by the agent's
      # runtime credential custody check.
      POSTGRES_DATABASE_URL_FILE: /run/psfn-auth/postgres-database-url
      NTFY_BASE_URL: http://operator-alert-sink:3000
      NTFY_TOPIC: smoke-operator-alerts
    networks:
      - psfn-smoke-internal
    volumes:
      - system-data:/app/runtime-root/system-data
      - companion-data:/app/runtime-root/companions/smoke
      - workspace:/app/runtime-root/workspaces/personal/${PSFN_SMOKE_COMPANION_ID:-11111111-1111-4111-8111-111111111111}
      - gateway-sock:/run/psfn
      - agent-auth:/run/psfn-auth:ro
      - model-cache:/app/models
    # No healthcheck: probing the agent must not open the gateway RPC socket
    # (that registers as a phantom agent connect/disconnect and flaps the
    # gateway). If the agent process exits, its container exits and surfaces as
    # not-running. Agent readiness is asserted via the gateway /health endpoint
    # (which only reports healthy once the agent's RPC has registered).

  # ── Satellite Hub ──
  # The PSFN Satellite Hub in text-only mode: no Deepgram/ElevenLabs, no device
  # registry, so a websocket client is admitted without a hub device credential
  # and receives session.ready immediately. It authenticates to the gateway as a
  # satellite-scoped principal and opens the companion relay SSE subscription at
  # boot, which is what proves the gateway accepted its satellite claim.
  satellite-hub:
    build:
      # The Hub Dockerfile's context is the hub app itself (it ships its own
      # package-lock.json); `dockerfile` resolves relative to that context.
      context: ../apps/satellite-hub
      dockerfile: ../../docker/satellite-hub/Dockerfile
    image: psfn-satellite-hub:smoke
    container_name: psfn-smoke-satellite-hub
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      # /v1 is appended by the hub; the companion bridge needs it spelled out.
      PSFN_API_BASE_URL: http://gateway:3000
      PSFN_COMPANION_BASE_URL: http://gateway:3000/v1
      PSFN_API_KEY: *satellite-key
      PSFN_MODEL: companion
      # Registry-aligned identity. PSFN_CLAIM_TYPE and PSFN_CHANNEL_TYPE are
      # explicit: an unset claim type falls back to the capability-profile
      # string, which would not match the registry endpoint.
      PSFN_SATELLITE_ID: *satellite-id
      PSFN_ENDPOINT_ID: *satellite-endpoint-id
      PSFN_CLAIM_TYPE: *satellite-claim-type
      PSFN_CHANNEL_TYPE: *satellite-claim-type
      PSFN_CAPABILITY_PROFILE: text-only
      # Voice providers are genuinely optional in text-only mode.
      HUB_TEXT_ONLY: "true"
      REALTIME_VOICE_BIND_HOST: 0.0.0.0
      REALTIME_VOICE_PORT: "8787"
      ARTIFACT_ROOT: /app/.artifacts/runtime-ts
    ports:
      - "127.0.0.1:${PSFN_SMOKE_HUB_PORT:-18787}:8787"
    networks:
      - psfn-smoke-internal
      - psfn-smoke-edge
    healthcheck:
      # Any non-websocket request to the hub port answers 200 psfn-satellite-hub.
      test:
        - "CMD"
        - "node"
        - "--input-type=module"
        - "--eval"
        - "const response = await fetch('http://127.0.0.1:8787/'); if (!response.ok) process.exit(1)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ── companion-ui test surface ──
  # Pre-built Vite PWA served by nginx-unprivileged. No server logic and no
  # outbound calls; the browser reaches the hub and the gateway directly.
  companion-ui:
    build:
      context: ..
      dockerfile: docker/companion-ui/Dockerfile
    image: psfn-companion-ui:smoke
    container_name: psfn-smoke-companion-ui
    environment:
      # nginx-unprivileged listens on 8080 as an arbitrary non-root uid.
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    ports:
      - "127.0.0.1:${PSFN_SMOKE_COMPANION_UI_PORT:-18080}:8080"
    networks:
      - psfn-smoke-edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/companion-ui/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

networks:
  # No external route: postgres + agent live here only, so the agent has no
  # outbound egress and boots past its network-isolation guard.
  psfn-smoke-internal:
    name: psfn-smoke-internal
    internal: true
  # External bridge for the gateway's provider egress only.
  psfn-smoke-egress:
    name: psfn-smoke-egress
  # Published loopback ports need a routable bridge: an internal network cannot
  # be reached from the host. This network exists ONLY so the smoke harness can
  # talk to the hub and the companion-ui surface from the host; it does grant
  # those two containers outbound bridge routing that neither service needs.
  psfn-smoke-edge:
    name: psfn-smoke-edge

volumes:
  pgdata:
  system-data:
  companion-data:
  workspace:
  gateway-sock:
  agent-auth:
  model-cache:
