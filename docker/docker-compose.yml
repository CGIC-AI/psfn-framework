name: psfn-continuous

services:
  # Continuous/dev runtime container profile.
  # For production, use docker-compose.production.yml instead.
  psfn-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    container_name: psfn-agent-continuous
    restart: unless-stopped
    networks:
      - psfn-continuous-net
    volumes:
      - type: bind
        source: ${PSFN_GATEWAY_SOCKET_DIR:-/run/psfn}
        target: /run/psfn
        bind:
          create_host_path: false
      - type: bind
        source: ../scripts/ops
        target: /app/scripts/ops
        read_only: true
        bind:
          create_host_path: false
      # Continuous/dev mutable roots (intentionally distinct from production roots)
      - type: bind
        source: ${PSFN_CONTINUOUS_DATA_DIR:-../runtime/continuous/data}
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ${PSFN_CONTINUOUS_WORKSPACE_DIR:-../runtime/continuous/workspace}
        target: /app/workspace
        bind:
          create_host_path: false
      # Character card + identity (RO)
      - type: bind
        source: ${CHARACTER_CARD_DIR:-/home/user/.openclaw/agents/main}
        target: /app/identity
        read_only: true
        bind:
          create_host_path: false
    environment:
      GATEWAY_SOCKET: /run/psfn/gateway.sock
      API_PORT: ${API_PORT:-3000}
      API_HOST: 127.0.0.1
      API_KEY: "${API_KEY:-}"
      ALLOW_INSECURE_LOCAL_API: "${ALLOW_INSECURE_LOCAL_API:-true}"
      API_HEALTH_SCHEDULER_HEARTBEAT_STALE_AFTER_MS: ${API_HEALTH_SCHEDULER_HEARTBEAT_STALE_AFTER_MS:-3900000}
      CONTINUITY_WATCHDOG_ENDPOINT: http://127.0.0.1:${API_PORT:-3000}/health
      CONTINUITY_WATCHDOG_API_KEY: "${CONTINUITY_WATCHDOG_API_KEY:-}"
      CONTINUITY_WATCHDOG_TIMEOUT_MS: ${CONTINUITY_WATCHDOG_TIMEOUT_MS:-5000}
      CONTINUITY_WATCHDOG_MAX_FAILURES: ${CONTINUITY_WATCHDOG_MAX_FAILURES:-5}
      CONTINUITY_WATCHDOG_STATE_FILE: /tmp/psfn-continuity-watchdog-state.json
      CONTINUITY_WATCHDOG_RESTART_PID: "1"
      PSFN_RUNTIME_LAYOUT_MODE: continuous
      DATA_DIR: /app/data
      SYSTEM_DATA_DIR: /app/data
      COMPANION_DATA_DIR: /app/data
      WORKSPACE_PATH: /app/workspace
      DATABASE_PATH: /app/data/psfn.db
      CHARACTER_CARD_PATH: /app/identity/character.json
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-1024}
    healthcheck:
      test: ["CMD", "node", "/app/scripts/ops/continuity-watchdog-healthcheck.mjs"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 90s

networks:
  psfn-continuous-net:
    name: psfn-continuous-net
    internal: true
