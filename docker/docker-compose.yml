name: psfn-continuous

services:
  # Continuous/dev runtime container profile.
  # For production, use docker-compose.production.yml instead.
  psfn-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    container_name: psfn-agent-continuous
    restart: "on-failure:3"
    networks:
      - psfn-continuous-net
    volumes:
      - type: bind
        source: ${PSFN_GATEWAY_SOCKET_DIR:-/run/psfn}
        target: /run/psfn
        bind:
          create_host_path: false
      # Continuous/dev mutable roots (intentionally distinct from production roots)
      - type: bind
        source: ${PSFN_CONTINUOUS_DATA_DIR:-../runtime/continuous/data}
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ${PSFN_CONTINUOUS_WORKSPACE_DIR:-../runtime/continuous/workspace}
        target: /app/workspace
        bind:
          create_host_path: false
      # Character card + identity (RO)
      - type: bind
        source: ${CHARACTER_CARD_DIR:-/home/user/.openclaw/agents/main}
        target: /app/identity
        read_only: true
        bind:
          create_host_path: false
    environment:
      GATEWAY_SOCKET: /run/psfn/gateway.sock
      PSFN_RUNTIME_LAYOUT_MODE: continuous
      DATA_DIR: /app/data
      SYSTEM_DATA_DIR: /app/data
      COMPANION_DATA_DIR: /app/data
      WORKSPACE_PATH: /app/workspace
      DATABASE_PATH: /app/data/purrsephone.db
      CHARACTER_CARD_PATH: /app/identity/character.json
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-1024}

networks:
  psfn-continuous-net:
    name: psfn-continuous-net
    internal: true
