# The disposable smoke stack's HTTPS origin. The public port binds loopback.
# Overwrite every forwarded provenance header; the gateway validates the exact
# origin and still authenticates the browser through its real ADMIN_TOKEN door.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/smoke-fleet-nginx.pid;
events { worker_connections 128; }
http {
  access_log off;
  client_body_temp_path /tmp/smoke-fleet-client;
  proxy_temp_path /tmp/smoke-fleet-proxy;
  fastcgi_temp_path /tmp/smoke-fleet-fastcgi;
  uwsgi_temp_path /tmp/smoke-fleet-uwsgi;
  scgi_temp_path /tmp/smoke-fleet-scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8443 ssl;
    ssl_certificate /run/psfn-fleet-tls/localhost.crt;
    ssl_certificate_key /run/psfn-fleet-tls/localhost.key;
    location / {
      proxy_pass http://gateway:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port "";
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Forwarded "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 120s;
    }
  }
}
