apiVersion: v1
kind: ConfigMap
metadata:
  name: psfn-config
  namespace: psfn
  labels:
    app.kubernetes.io/part-of: psfn
data:
  PSFN_RUNTIME_LAYOUT_MODE: "production"
  PSFN_RUNTIME_MODE: "split"
  GATEWAY_SOCKET: "/run/psfn/gateway.sock"

  API_PORT: "3000"
  API_HOST: "0.0.0.0"
  ADMIN_PORT: "3001"
  ADMIN_HOST: "0.0.0.0"
  ALLOW_INSECURE_LOCAL_API: "false"

  SYSTEM_DATA_DIR: "/app/system-data"
  COMPANION_DATA_DIR: "/app/companion-data"
  WORKSPACE_PATH: "/app/workspace"
  CHARACTER_CARD_PATH: "/app/identity/character.json"
  PERSISTENCE_BACKEND: "postgres"

  EMBEDDING_PROVIDER: "api"
  EMBEDDING_API_URL: "http://tei:8090/v1/embeddings"
  EMBEDDING_API_MODEL: "BAAI/bge-large-en-v1.5"
  EMBEDDING_DIMS: "1024"
  LOG_LEVEL: "info"

  LITELLM_BASE_URL: "http://litellm:4000/v1"

  API_HEALTH_SCHEDULER_HEARTBEAT_STALE_AFTER_MS: "3900000"
  CONTINUITY_WATCHDOG_TIMEOUT_MS: "5000"
  CONTINUITY_WATCHDOG_MAX_FAILURES: "5"
