apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: psfn
  labels:
    app.kubernetes.io/part-of: psfn
    app.kubernetes.io/component: litellm
data:
  litellm_config.yaml: |
    model_list:
      - model_name: openrouter/*
        litellm_params:
          model: openrouter/*
          api_key: os.environ/OPENROUTER_API_KEY

    litellm_settings:
      drop_params: true
      request_timeout: 120
      stream: true

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: psfn
  labels:
    app.kubernetes.io/part-of: psfn
    app.kubernetes.io/component: litellm
type: Opaque
stringData:
  OPENROUTER_API_KEY: ""
  LITELLM_MASTER_KEY: ""
  # FAL_AI_API_KEY: ""
