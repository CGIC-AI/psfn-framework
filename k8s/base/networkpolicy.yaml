apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: psfn-agent-isolation
  namespace: psfn
  labels:
    app.kubernetes.io/part-of: psfn
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: psfn
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lightllm
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-isolation
  namespace: psfn
  labels:
    app.kubernetes.io/part-of: psfn
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: psfn
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lightllm-isolation
  namespace: psfn
  labels:
    app.kubernetes.io/part-of: psfn
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lightllm
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: psfn
      ports:
        - port: 8080
          protocol: TCP
