apiVersion: apps/v1
kind: Deployment
metadata:
  name: psfn
  namespace: psfn
  labels:
    app.kubernetes.io/name: psfn
    app.kubernetes.io/part-of: psfn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: psfn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: psfn
        app.kubernetes.io/part-of: psfn
    spec:
      serviceAccountName: psfn
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch

      volumes:
        - name: gateway-socket
          emptyDir: {}
        - name: companion-data
          persistentVolumeClaim:
            claimName: psfn-companion-data
        - name: system-data
          persistentVolumeClaim:
            claimName: psfn-system-data
        - name: workspace
          persistentVolumeClaim:
            claimName: psfn-workspace
        - name: identity
          configMap:
            name: psfn-identity
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: postgres-database-url
          secret:
            secretName: psfn-secrets
            items:
              - key: POSTGRES_DATABASE_URL
                path: database-url

      containers:
        - name: gateway
          image: psfn-agent:0.1.0
          command: ["node", "dist/gateway-main.js"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: psfn-config
            - secretRef:
                name: psfn-secrets
          volumeMounts:
            - name: gateway-socket
              mountPath: /run/psfn
            - name: system-data
              mountPath: /app/system-data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            exec:
              command: ["test", "-S", "/run/psfn/gateway.sock"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

        - name: agent
          image: psfn-agent:0.1.0
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop: ["ALL"]
          ports:
            - name: api
              containerPort: 3000
              protocol: TCP
            - name: admin
              containerPort: 3001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: psfn-config
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: psfn-secrets
                  key: API_KEY
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: psfn-secrets
                  key: ADMIN_TOKEN
            - name: GATEWAY_SESSION_INTEGRITY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: psfn-secrets
                  key: GATEWAY_SESSION_INTEGRITY_AUTH_TOKEN
            - name: GATEWAY_COMPANION_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: psfn-secrets
                  key: GATEWAY_COMPANION_AUTH_TOKEN
                  optional: true
            - name: POSTGRES_DATABASE_URL_FILE
              value: /var/run/secrets/psfn-postgres/database-url
            - name: CONTINUITY_WATCHDOG_ENDPOINT
              value: "http://127.0.0.1:3000/health"
            - name: CONTINUITY_WATCHDOG_RESTART_PID
              value: "0"
          volumeMounts:
            - name: gateway-socket
              mountPath: /run/psfn
            - name: companion-data
              mountPath: /app/companion-data
            - name: system-data
              mountPath: /app/system-data
            - name: workspace
              mountPath: /app/workspace
            - name: identity
              mountPath: /app/identity
              readOnly: true
            - name: tmp
              mountPath: /app/tmp
            - name: logs
              mountPath: /app/logs
            - name: postgres-database-url
              mountPath: /var/run/secrets/psfn-postgres
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
            timeoutSeconds: 8
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 8
