apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: psfn-companion-data
  namespace: psfn
  labels:
    app.kubernetes.io/part-of: psfn
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
