# LiteLLM Proxy — credential isolation for PSFN
#
# Usage:
#   cd proxy && docker compose up -d
#
# The proxy listens on localhost:4000 and routes LLM requests
# to upstream providers using real API keys held in .env.

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: psfn-litellm
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    env_file:
      - .env
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
