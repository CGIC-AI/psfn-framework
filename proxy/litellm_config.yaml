# LiteLLM Proxy Configuration
# PSFN Substrate — credential isolation layer
#
# The agent process connects to localhost:4000 with a virtual key.
# Real provider API keys are held here, never exposed to the agent.

model_list:
  # ── Primary: GLM-5 via OpenRouter ──
  - model_name: z-ai/glm-5
    litellm_params:
      model: openrouter/z-ai/glm-5
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 16384

  # ── DeepSeek V3.2 via OpenRouter ──
  - model_name: deepseek/deepseek-v3.2
    litellm_params:
      model: openrouter/deepseek/deepseek-v3.2
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 16384

  # ── Kimi K2.5 via OpenRouter (reasoning model — needs headroom) ──
  - model_name: moonshotai/kimi-k2.5
    litellm_params:
      model: openrouter/moonshotai/kimi-k2.5
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 16384

  # ── Fallback: OpenRouter wildcard ──
  # Any model not listed above routes through OpenRouter
  - model_name: openrouter/*
    litellm_params:
      model: openrouter/*
      api_key: os.environ/OPENROUTER_API_KEY

  # ── FAL image generation models ──
  - model_name: fal-ai/nano-banana-2
    litellm_params:
      model: fal_ai/fal-ai/nano-banana-2
      api_key: os.environ/FAL_AI_API_KEY
    model_info:
      mode: image_generation

  - model_name: fal-ai/nano-banana-pro
    litellm_params:
      model: fal_ai/fal-ai/nano-banana-pro
      api_key: os.environ/FAL_AI_API_KEY
    model_info:
      mode: image_generation

  - model_name: fal-ai/gpt-image-1.5
    litellm_params:
      model: fal_ai/fal-ai/gpt-image-1.5
      api_key: os.environ/FAL_AI_API_KEY
    model_info:
      mode: image_generation

  - model_name: xai/grok-imagine-image
    litellm_params:
      model: fal_ai/xai/grok-imagine-image
      api_key: os.environ/FAL_AI_API_KEY
    model_info:
      mode: image_generation

  - model_name: fal-ai/flux-2
    litellm_params:
      model: fal_ai/fal-ai/flux-2
      api_key: os.environ/FAL_AI_API_KEY
    model_info:
      mode: image_generation

  - model_name: fal-ai/flux-2-pro
    litellm_params:
      model: fal_ai/fal-ai/flux-2-pro
      api_key: os.environ/FAL_AI_API_KEY
    model_info:
      mode: image_generation

  - model_name: fal-ai/flux-2-flex
    litellm_params:
      model: fal_ai/fal-ai/flux-2-flex
      api_key: os.environ/FAL_AI_API_KEY
    model_info:
      mode: image_generation

  - model_name: fal-ai/flux/krea
    litellm_params:
      model: fal_ai/fal-ai/flux/krea
      api_key: os.environ/FAL_AI_API_KEY
    model_info:
      mode: image_generation

  - model_name: fal-ai/flux-2/klein/4b
    litellm_params:
      model: fal_ai/fal-ai/flux-2/klein/4b
      api_key: os.environ/FAL_AI_API_KEY
    model_info:
