# Prepared from the immutable upstream profile recorded in ../source-lock.json.
# Run `npm run firmware:prepare:waveshare-bedroom` before validation or build.
packages:
  hardware_baseline: !include ../.generated/upstream-profile.yaml

substitutions:
  name: purrsephone-bedroom
  friendly_name: Purrsephone Bedroom

esphome:
  includes:
    - includes/ui_state.h

# The upstream full profile enables copying executable code and read-only
# assets into PSRAM. Its embedded UI assets alone exceed this board's 8 MB
# PSRAM, causing an abort before setup(). Leave them mapped in 16 MB flash and
# reserve PSRAM for the audio pipelines and display buffers.
esp32:
  framework:
    sdkconfig_options:
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "n"
      CONFIG_SPIRAM_RODATA: "n"

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    id: !extend ota_esphome
    password: !secret ota_password
